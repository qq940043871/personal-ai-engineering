<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedding（嵌入）</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            overflow: hidden;
        }
        .slide {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: linear-gradient(135deg, #0a2463, #1e3a8a, #3b82f6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.15;
            background-image: url('https://picsum.photos/seed/neural-network-abstract/1280/720.jpg');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: 2;
        }
        .content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            padding: 60px 80px;
            flex-grow: 1;
        }
        .title {
            font-size: 56px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 40px;
            letter-spacing: 1px;
            opacity: 0;
            transform: translateX(50px);
            animation: slideInFromRight 0.8s ease-out forwards;
        }
        .section {
            margin-bottom: 30px;
            opacity: 0;
        }
        .section-title {
            font-size: 24px;
            font-weight: 700;
            color: #a5f3fc;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        .section-title .material-icons {
            margin-right: 10px;
            font-size: 28px;
        }
        .section-content {
            font-size: 20px;
            color: #ffffff;
            line-height: 1.6;
            padding-left: 38px;
        }
        .section-content li {
            margin-bottom: 10px;
            list-style-type: none;
            position: relative;
        }
        .section-content li:before {
            content: "•";
            color: #38bdf8;
            font-weight: bold;
            position: absolute;
            left: -20px;
        }
        .highlight {
            color: #fbbf24;
            font-weight: 700;
        }
        .importance {
            background: rgba(59, 130, 246, 0.2);
            border-left: 4px solid #fbbf24;
            padding: 15px 20px;
            border-radius: 0 8px 8px 0;
            margin-top: 20px;
        }
        .importance .section-content {
            padding-left: 0;
        }
        .importance .section-content li:before {
            display: none;
        }
        .vector-visual {
            position: absolute;
            right: 80px;
            top: 50%;
            transform: translateY(-50%);
            width: 400px;
            height: 400px;
            opacity: 0;
            animation: fadeIn 1s ease-out 1s forwards;
        }
        .vector-space {
            position: relative;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
            overflow: hidden;
        }
        .axis {
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
        }
        .x-axis {
            width: 100%;
            height: 1px;
            top: 50%;
            left: 0;
        }
        .y-axis {
            width: 1px;
            height: 100%;
            top: 0;
            left: 50%;
        }
        .vector-point {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        .vector-label {
            position: absolute;
            font-size: 16px;
            color: #ffffff;
            transform: translate(-50%, -150%);
            white-space: nowrap;
        }
        .vector-arrow {
            position: absolute;
            width: 100px;
            height: 2px;
            background: rgba(251, 191, 36, 0.7);
            transform-origin: left center;
        }
        .arrow-label {
            position: absolute;
            font-size: 14px;
            color: #fbbf24;
            transform: translate(-50%, -150%);
            white-space: nowrap;
        }
        
        @keyframes slideInFromRight {
            0% {
                opacity: 0;
                transform: translateX(50px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="slide">
        <div class="background"></div>
        <div class="grid-overlay"></div>
        <div class="content">
            <h1 class="title">Embedding（嵌入）</h1>
            
            <div class="section" style="animation: fadeIn 0.8s ease-out 0.5s forwards;">
                <div class="section-title">
                    <i class="material-icons">lightbulb</i>一句话解释
                </div>
                <div class="section-content">
                    将Token转化为计算机能懂的<span class="highlight">向量</span>。
                </div>
            </div>
            
            <div class="section" style="animation: fadeIn 0.8s ease-out 0.8s forwards;">
                <div class="section-title">
                    <i class="material-icons">info</i>详细说明
                </div>
                <div class="section-content">
                    <ul>
                        <li style="animation: popIn 0.5s ease-out 1.1s forwards; opacity: 0;">高维空间中的坐标，语义相近的Token距离更近。</li>
                        <li style="animation: popIn 0.5s ease-out 1.3s forwards; opacity: 0;">如"<span class="highlight">国王</span>"和"<span class="highlight">女王</span>"在向量空间中位置接近。</li>
                    </ul>
                </div>
            </div>
            
            <div class="section importance" style="animation: fadeIn 0.8s ease-out 1.5s forwards;">
                <div class="section-title">
                    <i class="material-icons">star</i>为什么重要
                </div>
                <div class="section-content">
                    <ul>
                        <li>是模型理解语言语义的<span class="highlight">核心机制</span>。</li>
                    </ul>
                </div>
            </div>
        </div>
        
        <div class="vector-visual">
            <div class="vector-space">
                <div class="axis x-axis"></div>
                <div class="axis y-axis"></div>
                
                <!-- 国王向量点 -->
                <div class="vector-point" style="background: #38bdf8; top: 40%; left: 35%;"></div>
                <div class="vector-label" style="top: 40%; left: 35%;">国王</div>
                
                <!-- 女王向量点 -->
                <div class="vector-point" style="background: #38bdf8; top: 45%; left: 40%;"></div>
                <div class="vector-label" style="top: 45%; left: 40%;">女王</div>
                
                <!-- 男人向量点 -->
                <div class="vector-point" style="background: #a5f3fc; top: 60%; left: 30%;"></div>
                <div class="vector-label" style="top: 60%; left: 30%;">男人</div>
                
                <!-- 女人向量点 -->
                <div class="vector-point" style="background: #a5f3fc; top: 65%; left: 35%;"></div>
                <div class="vector-label" style="top: 65%; left: 35%;">女人</div>
                
                <!-- 语义相近箭头 -->
                <div class="vector-arrow" style="top: 42.5%; left: 35%; transform: rotate(10deg);"></div>
                <div class="arrow-label" style="top: 42.5%; left: 40%;">语义相近</div>
            </div>
        </div>
    </div>
</body>
</html>
