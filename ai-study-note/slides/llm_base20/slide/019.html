<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNN：序列数据的'记忆大师'</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #0a192f;
            color: #ffffff;
            overflow: hidden;
        }
        .slide-container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #0a192f 0%, #172a45 100%);
        }
        .tech-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(0, 149, 255, 0.3) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 60px 80px;
        }
        .title {
            font-size: 50px;
            font-weight: 700;
            margin-bottom: 40px;
            color: #ffffff;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .main-content {
            display: flex;
            flex: 1;
            gap: 40px;
        }
        .text-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .description {
            font-size: 24px;
            line-height: 1.6;
            color: #a8b2d1;
            margin-bottom: 30px;
        }
        .highlight {
            color: #64ffda;
            font-weight: 500;
        }
        .visual-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .rnn-container {
            position: relative;
            width: 400px;
            height: 400px;
        }
        .rnn-cell {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.5);
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }
        .rnn-icon {
            font-size: 40px;
            color: white;
            margin-bottom: 5px;
        }
        .rnn-label {
            font-size: 14px;
            font-weight: 500;
            color: white;
            text-align: center;
        }
        .cell-1 {
            top: 20%;
            left: 20%;
            animation-delay: 0.5s;
        }
        .cell-2 {
            top: 20%;
            right: 20%;
            animation-delay: 1s;
        }
        .cell-3 {
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 1.5s;
        }
        .memory {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(79, 172, 254, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }
        .memory-icon {
            font-size: 60px;
            color: white;
        }
        .connection {
            position: absolute;
            background: rgba(100, 255, 218, 0.3);
            opacity: 0;
            animation: connect 1.5s ease-in-out forwards;
        }
        .connection-1 {
            width: 4px;
            height: 100px;
            top: 30%;
            left: 30%;
            transform: rotate(45deg);
            transform-origin: top left;
            animation-delay: 1.2s;
        }
        .connection-2 {
            width: 4px;
            height: 100px;
            top: 30%;
            right: 30%;
            transform: rotate(-45deg);
            transform-origin: top right;
            animation-delay: 1.7s;
        }
        .connection-3 {
            width: 4px;
            height: 80px;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 2.2s;
        }
        .data-flow {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: rgba(100, 255, 218, 0.7);
            opacity: 0;
            animation: flow 3s ease-in-out infinite;
        }
        .flow-1 {
            top: 40%;
            left: 30%;
            animation-delay: 1.4s;
        }
        .flow-2 {
            top: 40%;
            right: 30%;
            animation-delay: 1.9s;
        }
        .flow-3 {
            bottom: 40%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 2.4s;
        }
        .sequence {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
            animation-delay: 2.5s;
        }
        .sequence-item {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: 500;
            color: #64ffda;
        }
        .sequence-arrow {
            display: flex;
            align-items: center;
            color: #64ffda;
            font-size: 24px;
        }
        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 0 10px 30px rgba(79, 172, 254, 0.5);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.05);
                box-shadow: 0 15px 40px rgba(79, 172, 254, 0.7);
            }
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes connect {
            0% {
                opacity: 0;
                height: 0;
            }
            100% {
                opacity: 1;
                height: 100px;
            }
        }
        @keyframes flow {
            0% {
                opacity: 0;
                transform: scale(0);
            }
            20% {
                opacity: 1;
                transform: scale(1);
            }
            80% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0);
            }
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="tech-dots"></div>
        <div class="content">
            <h1 class="title">RNN：序列数据的'记忆大师'</h1>
            <div class="main-content">
                <div class="text-content">
                    <p class="description">处理<span class="highlight">序列数据</span>的神经网络</p>
                    <p class="description">有<span class="highlight">"记忆"</span>功能，能记住前序信息影响当前输出</p>
                    <p class="description">像读文章时，理解当前句会<span class="highlight">联系前文内容</span></p>
                    <p class="description">适用于<span class="highlight">自然语言处理</span>、<span class="highlight">时间序列预测</span>等任务</p>
                </div>
                <div class="visual-content">
                    <div class="rnn-container">
                        <div class="rnn-cell cell-1">
                            <i class="material-icons rnn-icon">looks_one</i>
                            <span class="rnn-label">时间步1</span>
                        </div>
                        <div class="rnn-cell cell-2">
                            <i class="material-icons rnn-icon">looks_two</i>
                            <span class="rnn-label">时间步2</span>
                        </div>
                        <div class="rnn-cell cell-3">
                            <i class="material-icons rnn-icon">looks_3</i>
                            <span class="rnn-label">时间步3</span>
                        </div>
                        <div class="memory">
                            <i class="material-icons memory-icon">memory</i>
                        </div>
                        <div class="connection connection-1"></div>
                        <div class="connection connection-2"></div>
                        <div class="connection connection-3"></div>
                        <div class="data-flow flow-1"></div>
                        <div class="data-flow flow-2"></div>
                        <div class="data-flow flow-3"></div>
                        <div class="sequence">
                            <div class="sequence-item">1</div>
                            <div class="sequence-arrow">→</div>
                            <div class="sequence-item">2</div>
                            <div class="sequence-arrow">→</div>
                            <div class="sequence-item">3</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
