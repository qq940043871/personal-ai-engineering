<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RLHF：让AI'听人话'</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #0a192f;
            color: #ffffff;
            overflow: hidden;
        }
        .slide-container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #0a192f 0%, #172a45 100%);
        }
        .tech-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(0, 149, 255, 0.3) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 60px 80px;
        }
        .title {
            font-size: 50px;
            font-weight: 700;
            margin-bottom: 40px;
            color: #ffffff;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .main-content {
            display: flex;
            flex: 1;
            gap: 40px;
        }
        .text-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .description {
            font-size: 24px;
            line-height: 1.6;
            color: #a8b2d1;
            margin-bottom: 30px;
        }
        .highlight {
            color: #64ffda;
            font-weight: 500;
        }
        .visual-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .rlhf-container {
            position: relative;
            width: 400px;
            height: 400px;
        }
        .ai-model {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }
        .ai-icon {
            font-size: 60px;
            color: white;
        }
        .human {
            position: absolute;
            top: 20%;
            left: 20%;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.5);
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
            animation-delay: 0.5s;
        }
        .human-icon {
            font-size: 40px;
            color: white;
        }
        .feedback {
            position: absolute;
            top: 20%;
            right: 20%;
            width: 80px;
            height: 80px;
            border-radius: 15px;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(250, 112, 154, 0.5);
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
            animation-delay: 1s;
        }
        .feedback-icon {
            font-size: 36px;
            color: white;
            margin-bottom: 5px;
        }
        .feedback-label {
            font-size: 14px;
            font-weight: 500;
            color: white;
            text-align: center;
        }
        .optimized {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            border-radius: 15px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(245, 87, 108, 0.5);
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
            animation-delay: 1.5s;
        }
        .optimized-icon {
            font-size: 36px;
            color: white;
            margin-bottom: 5px;
        }
        .optimized-label {
            font-size: 14px;
            font-weight: 500;
            color: white;
            text-align: center;
        }
        .connection {
            position: absolute;
            background: rgba(100, 255, 218, 0.3);
            opacity: 0;
            animation: connect 1.5s ease-in-out forwards;
        }
        .connection-1 {
            width: 4px;
            height: 100px;
            top: 30%;
            left: 30%;
            transform: rotate(45deg);
            transform-origin: top left;
            animation-delay: 1.2s;
        }
        .connection-2 {
            width: 4px;
            height: 100px;
            top: 30%;
            right: 30%;
            transform: rotate(-45deg);
            transform-origin: top right;
            animation-delay: 1.7s;
        }
        .connection-3 {
            width: 4px;
            height: 80px;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 2.2s;
        }
        .data-flow {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: rgba(100, 255, 218, 0.7);
            opacity: 0;
            animation: flow 3s ease-in-out infinite;
        }
        .flow-1 {
            top: 40%;
            left: 30%;
            animation-delay: 1.4s;
        }
        .flow-2 {
            top: 40%;
            right: 30%;
            animation-delay: 1.9s;
        }
        .flow-3 {
            bottom: 40%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 2.4s;
        }
        .score {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: 700;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }
        .high-score {
            top: 35%;
            right: 35%;
            background-color: rgba(100, 255, 218, 0.2);
            color: #64ffda;
            border: 2px solid #64ffda;
            animation-delay: 2s;
        }
        .low-score {
            top: 45%;
            right: 25%;
            background-color: rgba(245, 87, 108, 0.2);
            color: #f5576c;
            border: 2px solid #f5576c;
            animation-delay: 2.2s;
        }
        .process-label {
            position: absolute;
            font-size: 16px;
            font-weight: 500;
            color: #a8b2d1;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }
        .label-1 {
            top: 10%;
            left: 15%;
            animation-delay: 1s;
        }
        .label-2 {
            top: 10%;
            right: 15%;
            animation-delay: 1.5s;
        }
        .label-3 {
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 2s;
        }
        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.05);
                box-shadow: 0 15px 40px rgba(102, 126, 234, 0.7);
            }
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes connect {
            0% {
                opacity: 0;
                height: 0;
            }
            100% {
                opacity: 1;
                height: 100px;
            }
        }
        @keyframes flow {
            0% {
                opacity: 0;
                transform: scale(0);
            }
            20% {
                opacity: 1;
                transform: scale(1);
            }
            80% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0);
            }
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="tech-dots"></div>
        <div class="content">
            <h1 class="title">RLHF：让AI'听人话'</h1>
            <div class="main-content">
                <div class="text-content">
                    <p class="description">用<span class="highlight">人类反馈</span>训练AI模型</p>
                    <p class="description">让它输出更<span class="highlight">符合人类偏好</span></p>
                    <p class="description">像给AI<span class="highlight">"打分"</span>，高分答案多学，低分答案少学</p>
                    <p class="description">慢慢变<span class="highlight">"听话"</span>，更符合人类期望</p>
                </div>
                <div class="visual-content">
                    <div class="rlhf-container">
                        <div class="ai-model">
                            <i class="material-icons ai-icon">smart_toy</i>
                        </div>
                        <div class="human">
                            <i class="material-icons human-icon">person</i>
                        </div>
                        <div class="feedback">
                            <i class="material-icons feedback-icon">thumb_up</i>
                            <span class="feedback-label">反馈</span>
                        </div>
                        <div class="optimized">
                            <i class="material-icons optimized-icon">upgrade</i>
                            <span class="optimized-label">优化</span>
                        </div>
                        <div class="connection connection-1"></div>
                        <div class="connection connection-2"></div>
                        <div class="connection connection-3"></div>
                        <div class="data-flow flow-1"></div>
                        <div class="data-flow flow-2"></div>
                        <div class="data-flow flow-3"></div>
                        <div class="score high-score">A+</div>
                        <div class="score low-score">C</div>
                        <div class="process-label label-1">人类评估</div>
                        <div class="process-label label-2">反馈信号</div>
                        <div class="process-label label-3">模型优化</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
