<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库管理 · ownrag</title>
<link rel="stylesheet" href="/ui/assets/app.css">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="/ui/assets/katex/katex.min.css?v=20261117">
</head>
<body data-page="kb">
<div class="app">
  <aside id="sidebar"></aside>

  <main>
    <div class="top"><h1>知识库</h1><div class="pills" id="pills"></div>
      <button class="btn sm ghost" id="kbReload">刷新</button></div>

    <div class="hint">三级下钻：<b>知识库 → 文档 → 向量块</b>。点卡片逐层钻取；块正文可展开看全文，
      「向量」列直接回答这块有没有真正写进 <span class="mono">chunk_vectors</span>（维数 / 模长 / 前几维）。
      选中状态写进 URL，可直接把某个文档或分块上下文发给别人。</div>

    <div class="card">
      <h3>知识库</h3>
      <div class="flex" style="margin-bottom:8px">
        <span class="tag tiny" id="kbSummary">–</span><span class="sp"></span>
        <button class="btn sm primary" id="kbNew">新建库</button>
      </div>
      <div id="kbCards" class="kb-cards"><div class="empty">加载中…</div></div>
    </div>

    <div class="grid g32" style="margin-top:14px">
      <div class="card">
        <h3>文档 <span class="tag chip" id="docTotal">–</span></h3>
        <div class="row">
          <div><label class="f">按文件名 / doc_id 过滤</label><input id="docQ" placeholder="如：政策 / 报销"></div>
          <div class="fix"><button class="btn sm" id="docGo">筛选</button></div>
        </div>
        <div id="docList" style="margin-top:10px"><div class="empty">请选择知识库</div></div>
        <div class="pager" id="docPager"></div>
      </div>
      <div class="card">
        <h3>向量分块 <span class="tag chip" id="chunkHead">–</span></h3>
        <div class="row">
          <div><label class="f">块内关键词（子串匹配，大小写不敏感）</label><input id="chunkQ" placeholder="如：报销上限"></div>
          <div class="fix"><button class="btn sm" id="chunkGo">筛选</button></div>
        </div>
        <div id="chunkList" style="margin-top:10px"><div class="empty">请选择文档</div></div>
        <div class="pager" id="chunkPager"></div>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <details id="dhPanel">
        <summary style="cursor:pointer;font-size:13px;color:#cfe2f5;font-weight:600">直击库（L0 精确 / L1 语义 / L2 沉淀）</summary>
        <div class="tiny" style="margin:8px 0">直击命中零检索零生成——答错比 RAG 更伤信任，所以先在这张表里把口径写死。这里按当前选中的知识库过滤。</div>
        <div id="dhList"><div class="empty">加载中…</div></div>
        <div class="sep"></div>
        <div class="row">
          <div class="fix" style="width:80px;flex:0 0 80px"><label class="f">level</label><select id="dhLevel"><option>L0</option><option>L1</option><option>L2</option></select></div>
          <div class="fix" style="width:150px;flex:0 0 150px"><label class="f">kb</label><select id="dhKb"></select></div>
          <div><label class="f">标准问</label><input id="dhQ" placeholder="报销上限是多少"></div>
        </div>
        <div class="row" style="margin-top:8px">
          <div><label class="f">答案（口径写死）</label><input id="dhA" placeholder="1234 元"></div>
          <div class="fix"><button class="btn" id="dhAdd">加入直击库</button></div>
        </div>
      </details>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="/ui/assets/app.js"></script>
<script src="/ui/assets/menu.js"></script>
<script src="/ui/assets/katex/katex.min.js?v=20261117"></script>
<script src="/ui/assets/katex/auto-render.min.js?v=20261117"></script>
<script src="/ui/assets/md.js?v=20261117"></script>
<script>
'use strict';
const M = { kb: '', docId: '', docQ: '', docOffset: 0, docLimit: 20,
            chunkQ: '', chunkOffset: 0, chunkLimit: 20, kbs: [], keepDocFromUrl: false };

function syncUrl() {
  const qs = new URLSearchParams();
  if (M.kb) qs.set('kb', M.kb);
  if (M.docId) qs.set('doc', M.docId);
  history.replaceState(null, '', '/ui/kb' + (qs.toString() ? '?' + qs : ''));
}

function pagerHtml(total, offset, count, limit) {
  const from = total ? offset + 1 : 0;
  const to = offset + count;
  return `<span>${fmt(from)}–${fmt(to)} / ${fmt(total)}</span><span class="sp"></span>`
    + `<button class="btn sm ghost" data-act="prev" ${offset <= 0 ? 'disabled' : ''}>上一页</button>`
    + `<button class="btn sm ghost" data-act="next" ${(offset + count) >= total ? 'disabled' : ''}>下一页</button>`;
}

/* ---------------- 知识库 ---------------- */
async function loadKbs() {
  try {
    const d = await api('/admin/kbs');
    M.kbs = d.kbs || [];
    $('#kbSummary').textContent = M.kbs.length + ' 个库 · '
      + fmt(M.kbs.reduce((n, k) => n + k.documents, 0)) + ' 篇文档 · '
      + fmt(M.kbs.reduce((n, k) => n + k.chunks, 0)) + ' 块';

    $('#kbCards').innerHTML = M.kbs.length ? M.kbs.map(k => `
      <div class="kb-card ${k.kb === M.kb ? 'on' : ''}" data-kb="${esc(k.kb)}">
        <div class="nm">${esc(k.kb)}
          <span class="chip ${k.source === 'apps.yaml' ? 'info' : 'v'}">${k.source === 'apps.yaml' ? '配置声明' : '运行时新建'}</span>
          ${k.chunks > 0 ? `<button class="btn sm ghost" data-act="reembed" data-kb="${esc(k.kb)}">重嵌</button>` : ''}
          ${k.source === 'registry' ? `<button class="btn sm ghost" data-act="delkb" data-kb="${esc(k.kb)}">删</button>` : ''}
        </div>
        <div class="st"><span>文档 <b>${fmt(k.documents)}</b></span><span>块 <b>${fmt(k.chunks)}</b></span>
          <span>向量 <b>${fmt(k.vectors)}</b></span><span>字 <b>${fmt(k.chars)}</b></span></div>
        ${k.description ? `<div class="tiny" style="margin-top:4px">${esc(k.description)}</div>` : ''}
      </div>`).join('') : '<div class="empty">还没有数据：先去「入库」上传一份文档</div>';

    const names = M.kbs.map(k => k.kb);
    if (names.length) fillSelect('#dhKb', names, names.includes(M.kb) ? M.kb : names[0]);

    const qs = new URLSearchParams(location.search);
    const urlKb = qs.get('kb');
    M.docId = qs.get('doc') || '';
    M.keepDocFromUrl = !!M.docId;
    if (!urlKb || !names.includes(urlKb)) {
      M.kb = (M.kbs.find(k => k.documents > 0) || M.kbs[0] || {}).kb || '';
    } else {
      M.kb = urlKb;
    }
    $$('.kb-card', $('#kbCards')).forEach(el => el.classList.toggle('on', el.dataset.kb === M.kb));
    syncUrl();
    await loadDocs();
    await loadDirectHits();
  } catch (e) {
    $('#kbCards').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

$('#kbCards').addEventListener('click', async e => {
  const re = e.target.closest('[data-act="reembed"]');
  if (re) {
    const kb = re.dataset.kb;
    if (!(await uiConfirm('按当前嵌入模型重算全部向量。耗时取决于块数与端点限速（约每千块 1-2 分钟），期间该库检索退 BM25 单路，重建完自动恢复。', '重建「' + kb + '」的全部向量？'))) return;
    toast('向量重建中…（别关页面，完成会提示）');
    try {
      const r = await postJSON('/admin/kbs/' + encodeURIComponent(kb) + '/reembed?batch=16');
      if (r.status === 'noop') toast('该库已全部是当前向量版本，无需重建', 'ok');
      else toast('重建完成：' + fmt(r.reembedded) + ' 块 · ' + fmt(r.docs) + ' 篇文档 · ' + r.ms + 'ms', 'ok');
      loadKbs();
    } catch (err) { toast('重建失败（已写入部分可用重跑续）：' + err.message, 'bad'); }
    return;
  }
  const del = e.target.closest('[data-act="delkb"]');
  if (del) {
    const kb = del.dataset.kb;
    if (!(await uiConfirm('该库必须为空，且删除后不可恢复。', '删除知识库「' + kb + '」？', true))) return;
    try {
      await api('/admin/kbs/' + encodeURIComponent(kb), { method: 'DELETE' });
      toast('已删除知识库 ' + kb, 'ok');
      if (M.kb === kb) { M.kb = ''; M.docId = ''; }
      await loadKbs();
    } catch (err) { toast(err.message, 'bad'); }
    return;
  }
  const card = e.target.closest('[data-kb]');
  if (!card || card.dataset.kb === M.kb) return;
  M.kb = card.dataset.kb;
  M.docId = ''; M.docOffset = 0; M.chunkOffset = 0; M.keepDocFromUrl = false;
  $('#docQ').value = ''; $('#chunkQ').value = '';
  M.docQ = ''; M.chunkQ = '';
  syncUrl();
  $$('.kb-card', $('#kbCards')).forEach(el => el.classList.toggle('on', el.dataset.kb === M.kb));
  loadDocs();
  loadDirectHits();
});

/* ---------------- 文档 ---------------- */
async function loadDocs() {
  if (!M.kb) {
    $('#docList').innerHTML = '<div class="empty">没有可选知识库</div>';
    $('#docPager').innerHTML = '';
    $('#chunkList').innerHTML = '<div class="empty">请先选择知识库</div>';
    return;
  }
  const qs = new URLSearchParams({ limit: M.docLimit, offset: M.docOffset });
  if (M.docQ) qs.set('q', M.docQ);
  try {
    const d = await api('/admin/kbs/' + encodeURIComponent(M.kb) + '/documents?' + qs);
    const rows = d.documents || [];
    $('#docTotal').textContent = d.total + ' 篇' + (d.public_only ? '（未登录仅公开）' : '');
    $('#docList').innerHTML = rows.length ? rows.map(r => {
      const cls = r.task_status === 'done' ? 'ok' : (r.task_status === 'failed' ? 'bad' : 'warn');
      const disabled = r.enabled === 0;
      const lv = String(r.access_level || 'public');
      return `<div class="doc-row ${r.doc_id === M.docId ? 'on' : ''}" data-doc="${esc(r.doc_id)}">
        <div class="nm">${esc(r.source_file || r.doc_id)}</div>
        <div class="meta">
          <span class="chip info">${fmt(r.chunk_count)} 块</span>
          <span class="chip ${r.vector_count > 0 ? 'ok' : 'warn'}">${fmt(r.vector_count)} 向量</span>
          ${isLoggedIn() ? accessChipEdit(lv, r.doc_id) : accessChip(lv)}
          ${r.task_status ? `<span class="chip ${cls}">${esc(r.task_status)}</span>` : ''}
          ${r.review_status && r.review_status !== 'approved' ? `<span class="chip warn">复核 ${esc(r.review_status)}</span>` : ''}
          ${disabled ? '<span class="chip warn">已停用</span>' : ''}
          <span class="tiny mono">${esc(shortId(r.doc_id))} · ${fmt(r.chars)} 字</span>
          <span class="sp"></span>
          ${r.vector_count < r.chunk_count ? `<button class="btn sm primary" data-act="vec" data-doc="${esc(r.doc_id)}">向量化</button>` : ''}
          <button class="btn sm ghost" data-act="toggle-en" data-doc="${esc(r.doc_id)}" data-en="${disabled ? 0 : 1}">${disabled ? '启用' : '停用'}</button>
          <button class="btn sm ghost" data-act="review" data-doc="${esc(r.doc_id)}">复核</button>
          <button class="btn sm ghost" data-act="del" data-doc="${esc(r.doc_id)}">删</button>
        </div></div>`;
    }).join('') : `<div class="empty">${M.docQ ? '没有匹配的文档' : '这个库里还没有已索引的文档'}</div>`;
    $('#docPager').innerHTML = pagerHtml(d.total, M.docOffset, rows.length, M.docLimit);

    if (!M.keepDocFromUrl && !rows.some(r => r.doc_id === M.docId)) {
      M.docId = rows.length ? rows[0].doc_id : '';
    }
    syncUrl();
    await loadChunks();
  } catch (e) {
    $('#docList').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

$('#docList').addEventListener('click', async e => {
  const row = e.target.closest('[data-doc]');
  if (!row) return;
  const doc = row.dataset.doc;
  const btn = e.target.closest('[data-act]');
  if (btn) {
    if (btn.dataset.act === 'acl') {
      if (await toggleDocAccess(doc, btn.dataset.lv)) await loadDocs();
      return;
    }
    if (btn.dataset.act === 'toggle-en') {
      const on = btn.dataset.en !== '0';
      if (!on && !(await uiConfirm('停用后这篇文档退出检索（分身不再引用），块与向量保留，随时可再启用。', '停用这篇文档？'))) return;
      try {
        await postJSON('/docs/' + encodeURIComponent(doc) + '/enabled', { enabled: !on });
        toast(on ? '已停用：检索不再引用该文档' : '已恢复检索', 'ok');
        await loadDocs();
      } catch (err) { toast(err.message, 'bad'); }
      return;
    }
    if (btn.dataset.act === 'vec') {
      toast('向量化中…（本地嵌入，每千块约 1-2 分钟）');
      try {
        const r = await postJSON('/admin/documents/' + encodeURIComponent(doc) + '/vectorize?batch=16');
        if (r.status === 'noop') toast('该文档已全部向量化', 'ok');
        else toast('向量化完成：' + fmt(r.vectorized) + ' 块 · ' + r.ms + 'ms', 'ok');
        await loadDocs();
      } catch (err) { toast('向量化失败（已写入部分可用重跑续）：' + err.message, 'bad'); }
      return;
    }
    if (btn.dataset.act === 'review') {
      goto('review', 'doc=' + encodeURIComponent(doc));
      return;
    }
    if (btn.dataset.act === 'del') {
      if (!(await uiConfirm('其全部分块、向量、指纹都会一并移除，且不可恢复。\n' + doc, '删除这篇文档？', true))) return;
      try {
        await api('/docs/' + encodeURIComponent(doc), { method: 'DELETE' });
        toast('已删除', 'ok');
        if (M.docId === doc) M.docId = '';
        M.keepDocFromUrl = false;
        await loadKbs();
      } catch (err) { toast(err.message, 'bad'); }
      return;
    }
  }
  M.docId = doc; M.keepDocFromUrl = false; M.chunkOffset = 0;
  syncUrl();
  $$('.doc-row', $('#docList')).forEach(el => el.classList.toggle('on', el.dataset.doc === doc));
  await loadChunks();
});

/* ---------------- 向量块 ---------------- */
async function loadChunks() {
  if (!M.docId) {
    $('#chunkHead').textContent = '–';
    $('#chunkList').innerHTML = '<div class="empty">请选择一篇文档</div>';
    $('#chunkPager').innerHTML = '';
    return;
  }
  const qs = new URLSearchParams({ limit: M.chunkLimit, offset: M.chunkOffset });
  if (M.kb) qs.set('kb', M.kb);
  if (M.chunkQ) qs.set('q', M.chunkQ);
  try {
    const d = await api('/admin/documents/' + encodeURIComponent(M.docId) + '/chunks?' + qs);
    const rows = d.chunks || [];
    $('#chunkHead').textContent = shortId(M.docId) + ' · ' + d.total + ' 块';
    $('#chunkList').innerHTML = rows.length ? rows.map(c => {
      const anchors = c.anchors || {}, vec = c.vector || {};
      const heading = (anchors.heading_path || []).join(' > ');
      const vecText = vec.present
        ? `chunk_vectors · dim=${vec.dim} · |v|=${vec.norm} · 前 ${(vec.preview || []).length} 维 = [${(vec.preview || []).join(', ')}]`
        : 'chunk_vectors · 无此块（embed 跳过或索引未写入）';
      return `<div class="chunk-card">
        <div class="h">
          <span class="chip info">#${fmt(c.ordinal)}</span>
          <span class="tiny mono">${esc(c.chunk_id)}</span>
          <span class="chip ${vec.present ? 'ok' : 'warn'}">${vec.present ? '向量 ' + vec.dim + ' 维' : '无向量'}</span>
          ${c.embed_version ? `<span class="chip v">${esc(c.embed_version)}</span>` : ''}
          ${c.source_type === 'av' ? '<span class="chip">音视频</span>' : ''}
          ${c.truncated ? '<span class="chip warn">正文截断</span>' : ''}
          <span class="sp"></span>
          <button class="btn sm ghost" data-act="toggle">展开/收起</button>
          <button class="btn sm ghost" data-act="copy" data-cid="${esc(c.chunk_id)}">复制ID</button>
          ${anchors.t ? Md.playBtn(M.docId, anchors.t) : ''}
        </div>
        <div class="tiny mono" style="margin-bottom:5px">${esc(heading || '（无章节路径）')} · ${fmt(c.chars)} 字 · ${esc(c.sensitivity || '-')} / ${esc(c.topic || '-')} / ${esc(c.doc_date || '-')}</div>
        <div class="body md-body">${Md.render(c.text, { docId: M.docId }) || '<span class="tiny">（块正文为空）</span>'}</div>
        <div class="vec">${esc(vecText)}</div>
        <div class="tiny mono" style="margin-top:5px">meta ${esc(JSON.stringify(c.meta || {}).slice(0, 300))}</div>
      </div>`;
    }).join('') : `<div class="empty">${M.chunkQ ? '这篇文档里没有匹配的块' : '这篇文档没有已索引的分块'}</div>`;
    $('#chunkPager').innerHTML = pagerHtml(d.total, M.chunkOffset, rows.length, M.chunkLimit);
    Md.typeset($('#chunkList'));
  } catch (e) {
    $('#chunkList').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

$('#chunkList').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  if (btn.dataset.act === 'toggle') {
    btn.closest('.chunk-card').classList.toggle('open');
  } else if (btn.dataset.act === 'copy') {
    navigator.clipboard.writeText(btn.dataset.cid).then(
      () => toast('chunk_id 已复制', 'ok'), () => toast('复制失败：' + btn.dataset.cid, 'bad'));
  }
});

for (const [sel, key] of [['#docPager', 'doc'], ['#chunkPager', 'chunk']]) {
  $(sel).addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const field = key === 'doc' ? 'docOffset' : 'chunkOffset';
    const size = key === 'doc' ? M.docLimit : M.chunkLimit;
    M[field] = Math.max(0, M[field] + (b.dataset.act === 'next' ? size : -size));
    key === 'doc' ? loadDocs() : loadChunks();
  });
}

$('#docGo').onclick = () => { M.docQ = $('#docQ').value.trim(); M.docOffset = 0; loadDocs(); };
$('#chunkGo').onclick = () => { M.chunkQ = $('#chunkQ').value.trim(); M.chunkOffset = 0; loadChunks(); };
$('#docQ').onkeydown = e => { if (e.key === 'Enter') $('#docGo').click(); };
$('#chunkQ').onkeydown = e => { if (e.key === 'Enter') $('#chunkGo').click(); };
$('#kbReload').onclick = loadKbs;
$('#kbNew').onclick = async () => {
  const r = await uiPrompt('新建知识库', [
    { key: 'kb', label: '库名（字母/数字/_/-，1-64 字符）', placeholder: '如：kb_resume' },
    { key: 'description', label: '描述（可留空）', placeholder: '这个库放什么语料' }
  ]);
  if (!r || !r.kb) return;
  try {
    await postJSON('/admin/kbs', { kb: r.kb, description: r.description || '' });
    toast('已新建知识库 ' + kb, 'ok');
    M.kb = kb; M.docId = ''; M.docOffset = 0; M.chunkOffset = 0;
    M.keepDocFromUrl = false; M.docQ = ''; M.chunkQ = '';
    $('#docQ').value = ''; $('#chunkQ').value = '';
    await loadKbs();
  } catch (e) { toast(e.message, 'bad'); }
};

/* ---------------- 直击库 ---------------- */
async function loadDirectHits() {
  try {
    const d = await api('/admin/direct_hits' + (M.kb ? '?kb=' + encodeURIComponent(M.kb) : ''));
    const hits = d.hits || [];
    $('#dhList').innerHTML = hits.length ? `<table><thead><tr><th>level</th><th>问题</th><th>答案</th><th></th></tr></thead><tbody>
      ${hits.map(h => `<tr><td><span class="chip v">${esc(h.level)}</span></td>
        <td>${esc(h.question)}</td><td class="mono" style="font-size:11.5px">${esc(h.answer)}</td>
        <td><button class="btn sm ghost" onclick="delHit('${esc(h.id)}')">删</button></td></tr>`).join('')}
      </tbody></table>` : '<div class="empty">当前库没有直击条目：加一条，然后在问答页问同一句话，看是否零检索命中</div>';
  } catch (e) { $('#dhList').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
$('#dhAdd').onclick = async () => {
  try {
    await postJSON('/admin/direct_hits', {
      kb: $('#dhKb').value, level: $('#dhLevel').value,
      question: $('#dhQ').value, answer: $('#dhA').value, aliases: []
    });
    toast('已加入直击库', 'ok'); $('#dhQ').value = ''; $('#dhA').value = ''; loadDirectHits();
  } catch (e) { toast(e.message, 'bad'); }
};
async function delHit(id) {
  try { await api('/admin/direct_hits/' + encodeURIComponent(id), { method: 'DELETE' }); toast('已删除', 'ok'); loadDirectHits(); }
  catch (e) { toast(e.message, 'bad'); }
}

window.pageInit = loadKbs;
boot();
</script>
</body>
</html>
