<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RLHF（基于人类反馈的强化学习）</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            overflow: hidden;
        }
        .slide {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: linear-gradient(135deg, #0a2463, #1e3a8a, #3b82f6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.15;
            background-image: url('https://picsum.photos/seed/neural-network-abstract/1280/720.jpg');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: 2;
        }
        .content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            padding: 60px 80px;
            flex-grow: 1;
        }
        .title {
            font-size: 56px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 40px;
            letter-spacing: 1px;
            opacity: 0;
            transform: translateY(-50px);
            animation: slideInFromTop 0.8s ease-out forwards;
        }
        .section {
            margin-bottom: 30px;
            opacity: 0;
        }
        .section-title {
            font-size: 24px;
            font-weight: 700;
            color: #a5f3fc;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        .section-title .material-icons {
            margin-right: 10px;
            font-size: 28px;
        }
        .section-content {
            font-size: 20px;
            color: #ffffff;
            line-height: 1.6;
            padding-left: 38px;
        }
        .section-content li {
            margin-bottom: 10px;
            list-style-type: none;
            position: relative;
        }
        .section-content li:before {
            content: "•";
            color: #38bdf8;
            font-weight: bold;
            position: absolute;
            left: -20px;
        }
        .highlight {
            color: #fbbf24;
            font-weight: 700;
        }
        .importance {
            background: rgba(59, 130, 246, 0.2);
            border-left: 4px solid #fbbf24;
            padding: 15px 20px;
            border-radius: 0 8px 8px 0;
            margin-top: 20px;
        }
        .importance .section-content {
            padding-left: 0;
        }
        .importance .section-content li:before {
            display: none;
        }
        .feedback-visual {
            position: absolute;
            right: 80px;
            top: 50%;
            transform: translateY(-50%);
            width: 450px;
            height: 450px;
            opacity: 0;
            animation: fadeIn 1s ease-out 1s forwards;
        }
        .feedback-diagram {
            position: relative;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
            overflow: hidden;
            padding: 20px;
        }
        .feedback-node {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 16px;
            text-align: center;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }
        .model-node {
            left: 50%;
            top: 50px;
            transform: translateX(-50%);
            background: rgba(59, 130, 246, 0.3);
            border: 2px solid #38bdf8;
            animation-delay: 1.5s;
        }
        .human-node {
            left: 50px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(251, 191, 36, 0.3);
            border: 2px solid #fbbf24;
            animation-delay: 1.7s;
        }
        .reward-node {
            right: 50px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(34, 197, 94, 0.3);
            border: 2px solid #22c55e;
            animation-delay: 1.9s;
        }
        .feedback-arrow {
            position: absolute;
            height: 2px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            animation: flowAnimation 1.5s ease-out forwards;
        }
        .feedback-arrow::after {
            content: '';
            position: absolute;
            right: 0;
            top: -4px;
            width: 0;
            height: 0;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 10px solid rgba(255, 255, 255, 0.5);
        }
        .arrow-model-human {
            left: 175px;
            top: 100px;
            width: 80px;
            transform: rotate(45deg);
            animation-delay: 2.1s;
        }
        .arrow-human-reward {
            left: 150px;
            top: 50%;
            width: 100px;
            animation-delay: 2.3s;
        }
        .arrow-reward-model {
            right: 150px;
            top: 100px;
            width: 80px;
            transform: rotate(-45deg);
            animation-delay: 2.5s;
        }
        .node-icon {
            font-size: 36px;
            margin-bottom: 5px;
        }
        .node-label {
            font-weight: 700;
        }
        
        @keyframes slideInFromTop {
            0% {
                opacity: 0;
                transform: translateY(-50px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes pulseHighlight {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.1);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        @keyframes flowAnimation {
            0% {
                opacity: 0;
                width: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 1;
                width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="slide">
        <div class="background"></div>
        <div class="grid-overlay"></div>
        <div class="content">
            <h1 class="title">RLHF（基于人类反馈的强化学习）</h1>
            
            <div class="section" style="animation: fadeIn 0.8s ease-out 0.5s forwards;">
                <div class="section-title">
                    <i class="material-icons">lightbulb</i>一句话解释
                </div>
                <div class="section-content">
                    用人类的<span class="highlight">好恶</span>来"调教"模型。
                </div>
            </div>
            
            <div class="section" style="animation: fadeIn 0.8s ease-out 0.8s forwards;">
                <div class="section-title">
                    <i class="material-icons">info</i>详细说明
                </div>
                <div class="section-content">
                    <ul>
                        <li style="animation: popIn 0.5s ease-out 1.1s forwards; opacity: 0;">通过<span class="highlight">人类偏好数据</span>优化模型输出。</li>
                        <li style="animation: popIn 0.5s ease-out 1.3s forwards; opacity: 0;">使模型更对齐<span class="highlight">人类价值观</span>。</li>
                    </ul>
                </div>
            </div>
            
            <div class="section importance" style="animation: fadeIn 0.8s ease-out 1.5s forwards;">
                <div class="section-title">
                    <i class="material-icons">star</i>为什么重要
                </div>
                <div class="section-content">
                    <ul>
                        <li>让模型更<span class="highlight">安全</span>、<span class="highlight">有用</span>、符合人类期望。</li>
                    </ul>
                </div>
            </div>
        </div>
        
        <div class="feedback-visual">
            <div class="feedback-diagram">
                <div class="feedback-node model-node">
                    <i class="material-icons node-icon">psychology</i>
                    <div class="node-label">模型</div>
                </div>
                <div class="feedback-node human-node">
                    <i class="material-icons node-icon">person</i>
                    <div class="node-label">人类</div>
                </div>
                <div class="feedback-node reward-node">
                    <i class="material-icons node-icon">emoji_events</i>
                    <div class="node-label">奖励</div>
                </div>
                <div class="feedback-arrow arrow-model-human"></div>
                <div class="feedback-arrow arrow-human-reward"></div>
                <div class="feedback-arrow arrow-reward-model"></div>
            </div>
        </div>
    </div>
</body>
</html>
