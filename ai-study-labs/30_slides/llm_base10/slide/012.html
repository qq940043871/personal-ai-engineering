<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大模型概念总结</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            overflow: hidden;
        }
        .slide {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: linear-gradient(135deg, #0a2463, #1e3a8a, #3b82f6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.15;
            background-image: url('https://picsum.photos/seed/neural-network-abstract/1280/720.jpg');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: 2;
        }
        .content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            padding: 60px 80px;
            flex-grow: 1;
            justify-content: center;
        }
        .title {
            font-size: 64px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 60px;
            letter-spacing: 2px;
            opacity: 0;
            transform: translateY(-50px);
            animation: slideInFromTop 0.8s ease-out forwards;
        }
        .summary-points {
            display: flex;
            flex-direction: column;
            gap: 40px;
            max-width: 800px;
        }
        .point {
            display: flex;
            align-items: flex-start;
            opacity: 0;
            animation: fadeIn 0.8s ease-out forwards;
        }
        .point:nth-child(1) {
            animation-delay: 0.5s;
        }
        .point:nth-child(2) {
            animation-delay: 0.8s;
        }
        .point:nth-child(3) {
            animation-delay: 1.1s;
        }
        .point-icon {
            flex-shrink: 0;
            width: 60px;
            height: 60px;
            background: rgba(59, 130, 246, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 20px;
        }
        .point-icon .material-icons {
            font-size: 32px;
            color: #a5f3fc;
        }
        .point-text {
            font-size: 28px;
            color: #ffffff;
            line-height: 1.5;
            padding-top: 15px;
        }
        .highlight {
            color: #fbbf24;
            font-weight: 700;
        }
        .gradient-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: linear-gradient(to top, rgba(10, 36, 99, 0.8), transparent);
            z-index: 2;
            opacity: 0;
            animation: fadeIn 1s ease-out 1.5s forwards;
        }
        .concept-circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, rgba(59, 130, 246, 0) 70%);
            z-index: 2;
        }
        .circle-1 {
            width: 300px;
            height: 300px;
            top: -100px;
            right: -100px;
            animation: pulse 8s infinite alternate;
        }
        .circle-2 {
            width: 400px;
            height: 400px;
            bottom: -150px;
            left: -150px;
            animation: pulse 10s infinite alternate-reverse;
        }
        
        @keyframes slideInFromTop {
            0% {
                opacity: 0;
                transform: translateY(-50px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.2;
            }
            100% {
                transform: scale(1.2);
                opacity: 0.4;
            }
        }
    </style>
</head>
<body>
    <div class="slide">
        <div class="background"></div>
        <div class="grid-overlay"></div>
        <div class="concept-circle circle-1"></div>
        <div class="concept-circle circle-2"></div>
        
        <div class="content">
            <h1 class="title">大模型概念总结</h1>
            
            <div class="summary-points">
                <div class="point">
                    <div class="point-icon">
                        <i class="material-icons">insights</i>
                    </div>
                    <div class="point-text">
                        从<span class="highlight">Token</span>到<span class="highlight">Hallucination</span>，理解大模型的核心。
                    </div>
                </div>
                
                <div class="point">
                    <div class="point-icon">
                        <i class="material-icons">foundation</i>
                    </div>
                    <div class="point-text">
                        这些概念是应用和开发大模型的<span class="highlight">基础</span>。
                    </div>
                </div>
                
                <div class="point">
                    <div class="point-icon">
                        <i class="material-icons">trending_up</i>
                    </div>
                    <div class="point-text">
                        未来趋势：<span class="highlight">更大规模</span>、<span class="highlight">更强能力</span>、<span class="highlight">更安全可靠</span>。
                    </div>
                </div>
            </div>
        </div>
        
        <div class="gradient-overlay"></div>
    </div>
</body>
</html>
