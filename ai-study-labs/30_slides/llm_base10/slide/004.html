<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformer Architecture（Transformer架构）</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            overflow: hidden;
        }
        .slide {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: linear-gradient(135deg, #0a2463, #1e3a8a, #3b82f6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.15;
            background-image: url('https://picsum.photos/seed/neural-network-abstract/1280/720.jpg');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: 2;
        }
        .content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            padding: 60px 80px;
            flex-grow: 1;
        }
        .title {
            font-size: 56px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 40px;
            letter-spacing: 1px;
            opacity: 0;
            transform: translateY(-50px);
            animation: slideInFromTop 0.8s ease-out forwards;
        }
        .section {
            margin-bottom: 30px;
            opacity: 0;
        }
        .section-title {
            font-size: 24px;
            font-weight: 700;
            color: #a5f3fc;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        .section-title .material-icons {
            margin-right: 10px;
            font-size: 28px;
        }
        .section-content {
            font-size: 20px;
            color: #ffffff;
            line-height: 1.6;
            padding-left: 38px;
        }
        .section-content li {
            margin-bottom: 10px;
            list-style-type: none;
            position: relative;
        }
        .section-content li:before {
            content: "•";
            color: #38bdf8;
            font-weight: bold;
            position: absolute;
            left: -20px;
        }
        .highlight {
            color: #fbbf24;
            font-weight: 700;
        }
        .importance {
            background: rgba(59, 130, 246, 0.2);
            border-left: 4px solid #fbbf24;
            padding: 15px 20px;
            border-radius: 0 8px 8px 0;
            margin-top: 20px;
        }
        .importance .section-content {
            padding-left: 0;
        }
        .importance .section-content li:before {
            display: none;
        }
        .transformer-visual {
            position: absolute;
            right: 80px;
            top: 50%;
            transform: translateY(-50%);
            width: 450px;
            height: 400px;
            opacity: 0;
            animation: fadeIn 1s ease-out 1s forwards;
        }
        .transformer-diagram {
            position: relative;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
            overflow: hidden;
            padding: 20px;
        }
        .transformer-block {
            position: absolute;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.5);
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 14px;
            text-align: center;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }
        .encoder {
            left: 20px;
            top: 50px;
            width: 180px;
            height: 300px;
            animation-delay: 1.5s;
        }
        .decoder {
            right: 20px;
            top: 50px;
            width: 180px;
            height: 300px;
            animation-delay: 1.7s;
        }
        .attention {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(251, 191, 36, 0.3);
            border: 2px solid #fbbf24;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fbbf24;
            font-weight: 700;
            font-size: 16px;
            text-align: center;
            opacity: 0;
            animation: pulseHighlight 1s ease-out 2s forwards;
        }
        .connection {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            opacity: 0;
        }
        .encoder-attention {
            left: 200px;
            top: 200px;
            width: 50px;
            height: 2px;
            transform: rotate(0deg);
            animation: fadeIn 0.5s ease-out 2.2s forwards;
        }
        .attention-decoder {
            right: 200px;
            top: 200px;
            width: 50px;
            height: 2px;
            transform: rotate(180deg);
            animation: fadeIn 0.5s ease-out 2.4s forwards;
        }
        .encoder-decoder {
            left: 50%;
            top: 200px;
            width: 2px;
            height: 100px;
            transform: translateX(-50%);
            animation: fadeIn 0.5s ease-out 2.6s forwards;
        }
        
        @keyframes slideInFromTop {
            0% {
                opacity: 0;
                transform: translateY(-50px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes pulseHighlight {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.1);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="slide">
        <div class="background"></div>
        <div class="grid-overlay"></div>
        <div class="content">
            <h1 class="title">Transformer Architecture（Transformer架构）</h1>
            
            <div class="section" style="animation: fadeIn 0.8s ease-out 0.5s forwards;">
                <div class="section-title">
                    <i class="material-icons">lightbulb</i>一句话解释
                </div>
                <div class="section-content">
                    大模型的"<span class="highlight">骨架</span>"，支撑其高效处理语言。
                </div>
            </div>
            
            <div class="section" style="animation: fadeIn 0.8s ease-out 0.8s forwards;">
                <div class="section-title">
                    <i class="material-icons">info</i>详细说明
                </div>
                <div class="section-content">
                    <ul>
                        <li style="animation: popIn 0.5s ease-out 1.1s forwards; opacity: 0;">核心是<span class="highlight">自注意力机制</span>，能捕捉长距离依赖。</li>
                        <li style="animation: popIn 0.5s ease-out 1.3s forwards; opacity: 0;">Encoder-Decoder结构适用于不同任务。</li>
                    </ul>
                </div>
            </div>
            
            <div class="section importance" style="animation: fadeIn 0.8s ease-out 1.5s forwards;">
                <div class="section-title">
                    <i class="material-icons">star</i>为什么重要
                </div>
                <div class="section-content">
                    <ul>
                        <li>是所有现代大模型的<span class="highlight">基础架构</span>。</li>
                    </ul>
                </div>
            </div>
        </div>
        
        <div class="transformer-visual">
            <div class="transformer-diagram">
                <div class="transformer-block encoder">Encoder<br>(编码器)</div>
                <div class="transformer-block decoder">Decoder<br>(解码器)</div>
                <div class="attention">自注意力<br>机制</div>
                <div class="connection encoder-attention"></div>
                <div class="connection attention-decoder"></div>
                <div class="connection encoder-decoder"></div>
            </div>
        </div>
    </div>
</body>
</html>
