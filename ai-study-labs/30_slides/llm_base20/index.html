<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI概念幻灯片轮播演示</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #0a192f;
            color: #ffffff;
        }
        .carousel-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        .slides-wrapper {
            display: flex;
            height: 100%;
            transition: transform 0.5s ease-in-out;
        }
        .slide {
            min-width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .slide iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            object-fit: cover;
        }
        .navigation {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }
        .nav-button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .nav-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }
        .nav-button i {
            font-size: 24px;
            color: white;
        }
        .slide-counter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            z-index: 10;
        }
        .thumbnails {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
            max-width: 90%;
            overflow-x: auto;
            padding: 10px;
        }
        .thumbnail {
            width: 120px;
            height: 68px;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        .thumbnail.active {
            border-color: #64ffda;
        }
        .thumbnail:hover {
            transform: scale(1.05);
        }
        .thumbnail iframe {
            width: 100%;
            height: 100%;
            border: none;
            transform: scale(0.3);
            transform-origin: 0 0;
            width: 400%;
            height: 400%;
        }
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .control-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .control-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .control-button i {
            font-size: 20px;
            color: white;
        }
        .slide-title {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: 500;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 10;
        }
        .fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100;
            background: #0a192f;
        }
        .thumbnails::-webkit-scrollbar {
            height: 6px;
        }
        .thumbnails::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        .thumbnails::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="carousel-container" id="carousel">
        <div class="slides-wrapper" id="slidesWrapper">
            <!-- 幻灯片将通过JavaScript动态加载 -->
        </div>
        
        <div class="navigation">
            <div class="nav-button" id="prevBtn">
                <i class="material-icons">chevron_left</i>
            </div>
            <div class="nav-button" id="nextBtn">
                <i class="material-icons">chevron_right</i>
            </div>
        </div>
        
        <div class="slide-counter" id="slideCounter">
            1 / 20
        </div>
        
        <div class="controls">
            <div class="control-button" id="playPauseBtn">
                <i class="material-icons">play_arrow</i>
            </div>
            <div class="control-button" id="fullscreenBtn">
                <i class="material-icons">fullscreen</i>
            </div>
        </div>
        
        <div class="slide-title" id="slideTitle">
            加载中...
        </div>
    </div>

    <script>
        // 幻灯片数据
        const slides = [
            { title: "AI世界的关键密码", file: "slide/001.html" },
            { title: "数据挖掘：挖掘数据'金矿'", file: "slide/002.html" },
            { title: "GAN：AI界的'创作者VS裁判'", file: "slide/003.html" },
            { title: "多模态：让AI感知'多彩世界'", file: "slide/004.html" },
            { title: "Agent：AI世界的'智能打工人'", file: "slide/005.html" },
            { title: "对齐：让AI走'正道'", file: "slide/006.html" },
            { title: "CNN：图像识别的'神枪手'", file: "slide/007.html" },
            { title: "ChatBot：你的AI'话搭子'", file: "slide/008.html" },
            { title: "CoT：给AI装'思考清单'", file: "slide/009.html" },
            { title: "扩散模型：让AI学会'渐进创作'", file: "slide/010.html" },
            { title: "拟合：模型的'过拟合陷阱'", file: "slide/011.html" },
            { title: "微调：给模型'定制升级'", file: "slide/012.html" },
            { title: "泛化能力：模型的'举一反三力'", file: "slide/013.html" },
            { title: "生成式AI：AI界'创作者'", file: "slide/014.html" },
            { title: "预训练：模型的'知识打底期'", file: "slide/015.html" },
            { title: "提示工程：和AI'精准对话'", file: "slide/016.html" },
            { title: "RAG：给AI装'外挂大脑'", file: "slide/017.html" },
            { title: "RLHF：让AI'听人话'", file: "slide/018.html" },
            { title: "RNN：序列数据的'记忆大师'", file: "slide/019.html" },
            { title: "监督微调：给AI请'私教'", file: "slide/020.html" }
        ];

        let currentSlide = 0;
        let isPlaying = false;
        let playInterval;
        let isFullscreen = false;

        // 初始化轮播
        function initCarousel() {
            const slidesWrapper = document.getElementById('slidesWrapper');
            
            // 创建幻灯片
            slides.forEach((slide, index) => {
                // 创建幻灯片iframe
                const slideDiv = document.createElement('div');
                slideDiv.className = 'slide';
                slideDiv.innerHTML = `<iframe src="${slide.file}" loading="lazy"></iframe>`;
                slidesWrapper.appendChild(slideDiv);
            });
            
            updateSlide();
        }

        // 更新幻灯片显示
        function updateSlide() {
            const slidesWrapper = document.getElementById('slidesWrapper');
            const slideCounter = document.getElementById('slideCounter');
            const slideTitle = document.getElementById('slideTitle');
            const thumbnails = document.querySelectorAll('.thumbnail');
            
            // 更新幻灯片位置
            slidesWrapper.style.transform = `translateX(-${currentSlide * 100}vw)`;
            
            // 更新计数器
            slideCounter.textContent = `${currentSlide + 1} / ${slides.length}`;
            
            // 更新标题
            slideTitle.textContent = slides[currentSlide].title;
            
            // 更新缩略图状态
            thumbnails.forEach((thumb, index) => {
                thumb.classList.toggle('active', index === currentSlide);
            });
            
            // 滚动缩略图到可见区域
            const activeThumbnail = thumbnails[currentSlide];
            if (activeThumbnail) {
                activeThumbnail.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }
        }

        // 导航到指定幻灯片
        function goToSlide(index) {
            currentSlide = index;
            updateSlide();
        }

        // 下一张幻灯片
        function nextSlide() {
            currentSlide = (currentSlide + 1) % slides.length;
            updateSlide();
        }

        // 上一张幻灯片
        function prevSlide() {
            currentSlide = (currentSlide - 1 + slides.length) % slides.length;
            updateSlide();
        }

        // 播放/暂停
        function togglePlayPause() {
            const playPauseBtn = document.getElementById('playPauseBtn');
            const icon = playPauseBtn.querySelector('i');
            
            if (isPlaying) {
                clearInterval(playInterval);
                icon.textContent = 'play_arrow';
                isPlaying = false;
            } else {
                playInterval = setInterval(nextSlide, 5000); // 每5秒切换
                icon.textContent = 'pause';
                isPlaying = true;
            }
        }

        // 全屏切换
        function toggleFullscreen() {
            const carousel = document.getElementById('carousel');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const icon = fullscreenBtn.querySelector('i');
            
            if (!isFullscreen) {
                if (carousel.requestFullscreen) {
                    carousel.requestFullscreen();
                } else if (carousel.webkitRequestFullscreen) {
                    carousel.webkitRequestFullscreen();
                } else if (carousel.msRequestFullscreen) {
                    carousel.msRequestFullscreen();
                }
                carousel.classList.add('fullscreen');
                icon.textContent = 'fullscreen_exit';
                isFullscreen = true;
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                carousel.classList.remove('fullscreen');
                icon.textContent = 'fullscreen';
                isFullscreen = false;
            }
        }

        // 键盘控制
        function handleKeyboard(e) {
            switch(e.key) {
                case 'ArrowLeft':
                    prevSlide();
                    break;
                case 'ArrowRight':
                case ' ':
                    nextSlide();
                    break;
                case 'Enter':
                    togglePlayPause();
                    break;
                case 'f':
                case 'F':
                    toggleFullscreen();
                    break;
            }
        }

        // 事件监听器
        document.getElementById('prevBtn').addEventListener('click', prevSlide);
        document.getElementById('nextBtn').addEventListener('click', nextSlide);
        document.getElementById('playPauseBtn').addEventListener('click', togglePlayPause);
        document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
        document.addEventListener('keydown', handleKeyboard);

        // 全屏变化监听
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.getElementById('carousel').classList.remove('fullscreen');
                document.querySelector('#fullscreenBtn i').textContent = 'fullscreen';
                isFullscreen = false;
            }
        });

        // 初始化
        initCarousel();
    </script>
</body>
</html>
