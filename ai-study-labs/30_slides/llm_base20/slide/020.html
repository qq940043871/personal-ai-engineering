<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>监督微调：给AI请'私教'</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #0a192f;
            color: #ffffff;
            overflow: hidden;
        }
        .slide-container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #0a192f 0%, #172a45 100%);
        }
        .tech-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(0, 149, 255, 0.3) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 60px 80px;
        }
        .title {
            font-size: 50px;
            font-weight: 700;
            margin-bottom: 40px;
            color: #ffffff;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .main-content {
            display: flex;
            flex: 1;
            gap: 40px;
        }
        .text-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .description {
            font-size: 24px;
            line-height: 1.6;
            color: #a8b2d1;
            margin-bottom: 30px;
        }
        .highlight {
            color: #64ffda;
            font-weight: 500;
        }
        .visual-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .sft-container {
            position: relative;
            width: 400px;
            height: 400px;
        }
        .ai-model {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }
        .ai-icon {
            font-size: 60px;
            color: white;
        }
        .labeled-data {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }
        .data-icon {
            font-size: 36px;
            color: white;
            margin-bottom: 5px;
        }
        .data-label {
            font-size: 14px;
            font-weight: 500;
            color: white;
            text-align: center;
        }
        .data-1 {
            top: 20%;
            left: 20%;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.5);
            animation-delay: 0.5s;
        }
        .data-2 {
            top: 20%;
            right: 20%;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            box-shadow: 0 10px 20px rgba(250, 112, 154, 0.5);
            animation-delay: 1s;
        }
        .data-3 {
            bottom: 20%;
            left: 20%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 10px 20px rgba(245, 87, 108, 0.5);
            animation-delay: 1.5s;
        }
        .data-4 {
            bottom: 20%;
            right: 20%;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            box-shadow: 0 10px 20px rgba(67, 233, 123, 0.5);
            animation-delay: 2s;
        }
        .connection {
            position: absolute;
            background: rgba(100, 255, 218, 0.3);
            opacity: 0;
            animation: connect 1.5s ease-in-out forwards;
        }
        .connection-1 {
            width: 4px;
            height: 80px;
            top: 30%;
            left: 30%;
            transform: rotate(45deg);
            transform-origin: top left;
            animation-delay: 1s;
        }
        .connection-2 {
            width: 4px;
            height: 80px;
            top: 30%;
            right: 30%;
            transform: rotate(-45deg);
            transform-origin: top right;
            animation-delay: 1.5s;
        }
        .connection-3 {
            width: 4px;
            height: 80px;
            bottom: 30%;
            left: 30%;
            transform: rotate(-45deg);
            transform-origin: bottom left;
            animation-delay: 2s;
        }
        .connection-4 {
            width: 4px;
            height: 80px;
            bottom: 30%;
            right: 30%;
            transform: rotate(45deg);
            transform-origin: bottom right;
            animation-delay: 2.5s;
        }
        .data-flow {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: rgba(100, 255, 218, 0.7);
            opacity: 0;
            animation: flow 3s ease-in-out infinite;
        }
        .flow-1 {
            top: 40%;
            left: 30%;
            animation-delay: 1.2s;
        }
        .flow-2 {
            top: 40%;
            right: 30%;
            animation-delay: 1.7s;
        }
        .flow-3 {
            bottom: 40%;
            left: 30%;
            animation-delay: 2.2s;
        }
        .flow-4 {
            bottom: 40%;
            right: 30%;
            animation-delay: 2.7s;
        }
        .teacher {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(245, 87, 108, 0.5);
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
            animation-delay: 0.3s;
        }
        .teacher-icon {
            font-size: 30px;
            color: white;
        }
        .teacher-connection {
            position: absolute;
            width: 4px;
            height: 60px;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(100, 255, 218, 0.3);
            opacity: 0;
            animation: connect 1.5s ease-in-out forwards;
            animation-delay: 0.8s;
        }
        .optimization-label {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            font-weight: 500;
            color: #64ffda;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
            animation-delay: 3s;
        }
        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.05);
                box-shadow: 0 15px 40px rgba(102, 126, 234, 0.7);
            }
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes connect {
            0% {
                opacity: 0;
                height: 0;
            }
            100% {
                opacity: 1;
                height: 80px;
            }
        }
        @keyframes flow {
            0% {
                opacity: 0;
                transform: scale(0);
            }
            20% {
                opacity: 1;
                transform: scale(1);
            }
            80% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0);
            }
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="tech-dots"></div>
        <div class="content">
            <h1 class="title">监督微调：给AI请'私教'</h1>
            <div class="main-content">
                <div class="text-content">
                    <p class="description">使用<span class="highlight">带标签数据</span>对预训练模型进行微调</p>
                    <p class="description">让模型更好<span class="highlight">适应特定任务</span></p>
                    <p class="description">像给AI请<span class="highlight">"专业家教"</span></p>
                    <p class="description">有<span class="highlight">标准答案</span>指导学习，提升模型性能</p>
                </div>
                <div class="visual-content">
                    <div class="sft-container">
                        <div class="teacher">
                            <i class="material-icons teacher-icon">school</i>
                        </div>
                        <div class="teacher-connection"></div>
                        <div class="ai-model">
                            <i class="material-icons ai-icon">psychology</i>
                        </div>
                        <div class="labeled-data data-1">
                            <i class="material-icons data-icon">label</i>
                            <span class="data-label">标签数据1</span>
                        </div>
                        <div class="labeled-data data-2">
                            <i class="material-icons data-icon">label</i>
                            <span class="data-label">标签数据2</span>
                        </div>
                        <div class="labeled-data data-3">
                            <i class="material-icons data-icon">label</i>
                            <span class="data-label">标签数据3</span>
                        </div>
                        <div class="labeled-data data-4">
                            <i class="material-icons data-icon">label</i>
                            <span class="data-label">标签数据4</span>
                        </div>
                        <div class="connection connection-1"></div>
                        <div class="connection connection-2"></div>
                        <div class="connection connection-3"></div>
                        <div class="connection connection-4"></div>
                        <div class="data-flow flow-1"></div>
                        <div class="data-flow flow-2"></div>
                        <div class="data-flow flow-3"></div>
                        <div class="data-flow flow-4"></div>
                        <div class="optimization-label">监督学习 + 精准优化</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
