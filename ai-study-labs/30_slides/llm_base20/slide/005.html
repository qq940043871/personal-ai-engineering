<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent：AI世界的'智能打工人'</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #0a192f;
            color: #ffffff;
            overflow: hidden;
        }
        .slide-container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #0a192f 0%, #172a45 100%);
        }
        .tech-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(0, 149, 255, 0.3) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 60px 80px;
        }
        .title {
            font-size: 50px;
            font-weight: 700;
            margin-bottom: 40px;
            color: #ffffff;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .main-content {
            display: flex;
            flex: 1;
            gap: 40px;
        }
        .text-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .description {
            font-size: 24px;
            line-height: 1.6;
            color: #a8b2d1;
            margin-bottom: 30px;
        }
        .highlight {
            color: #64ffda;
            font-weight: 500;
        }
        .visual-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .robot-container {
            position: relative;
            width: 400px;
            height: 400px;
        }
        .robot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
            animation: float 3s ease-in-out infinite;
        }
        .robot-icon {
            font-size: 80px;
            color: white;
        }
        .action {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            animation: fadeIn 1s ease-in-out forwards;
        }
        .action-icon {
            font-size: 36px;
            color: white;
            margin-bottom: 5px;
        }
        .action-label {
            font-size: 14px;
            font-weight: 500;
            color: white;
            text-align: center;
        }
        .sense {
            top: 20%;
            left: 20%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 10px 20px rgba(245, 87, 108, 0.5);
            animation-delay: 0.5s;
        }
        .think {
            top: 20%;
            right: 20%;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.5);
            animation-delay: 1s;
        }
        .act {
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            box-shadow: 0 10px 20px rgba(250, 112, 154, 0.5);
            animation-delay: 1.5s;
        }
        .path {
            position: absolute;
            background: rgba(100, 255, 218, 0.3);
            opacity: 0;
            animation: drawPath 1.5s ease-in-out forwards;
        }
        .path-1 {
            width: 4px;
            height: 100px;
            top: 30%;
            left: 30%;
            transform: rotate(45deg);
            transform-origin: top left;
            animation-delay: 2s;
        }
        .path-2 {
            width: 4px;
            height: 100px;
            top: 30%;
            right: 30%;
            transform: rotate(-45deg);
            transform-origin: top right;
            animation-delay: 2.2s;
        }
        .path-3 {
            width: 4px;
            height: 80px;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 2.4s;
        }
        .robot-move {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: rgba(100, 255, 218, 0.7);
            opacity: 0;
            animation: moveRobot 4s ease-in-out infinite;
        }
        .move-1 {
            top: 40%;
            left: 30%;
            animation-delay: 2.5s;
        }
        .move-2 {
            top: 40%;
            right: 30%;
            animation-delay: 3s;
        }
        .move-3 {
            bottom: 40%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 3.5s;
        }
        @keyframes float {
            0%, 100% {
                transform: translate(-50%, -50%);
            }
            50% {
                transform: translate(-50%, -60%);
            }
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0);
            }
            70% {
                opacity: 1;
                transform: scale(1.1);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes drawPath {
            0% {
                opacity: 0;
                height: 0;
            }
            100% {
                opacity: 1;
                height: 100px;
            }
        }
        @keyframes moveRobot {
            0% {
                opacity: 0;
                transform: scale(0);
            }
            20% {
                opacity: 1;
                transform: scale(1);
            }
            80% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0);
            }
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="tech-dots"></div>
        <div class="content">
            <h1 class="title">Agent：AI世界的'智能打工人'</h1>
            <div class="main-content">
                <div class="text-content">
                    <p class="description"><span class="highlight">智能地行动</span>的代理，能<span class="highlight">感知环境</span>并自主<span class="highlight">"做事"</span></p>
                    <p class="description">像<span class="highlight">智能客服Agent</span>感知用户问题，自动找答案回复</p>
                    <p class="description">是AI系统里的<span class="highlight">"全能小助手"</span></p>
                    <p class="description">能<span class="highlight">自主决策</span>并<span class="highlight">执行任务</span>，无需人工干预</p>
                </div>
                <div class="visual-content">
                    <div class="robot-container">
                        <div class="action sense">
                            <i class="material-icons action-icon">visibility</i>
                            <span class="action-label">感知</span>
                        </div>
                        <div class="action think">
                            <i class="material-icons action-icon">psychology</i>
                            <span class="action-label">思考</span>
                        </div>
                        <div class="action act">
                            <i class="material-icons action-icon">smart_toy</i>
                            <span class="action-label">行动</span>
                        </div>
                        <div class="path path-1"></div>
                        <div class="path path-2"></div>
                        <div class="path path-3"></div>
                        <div class="robot">
                            <i class="material-icons robot-icon">android</i>
                        </div>
                        <div class="robot-move move-1"></div>
                        <div class="robot-move move-2"></div>
                        <div class="robot-move move-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
