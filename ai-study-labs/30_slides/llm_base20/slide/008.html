<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot：你的AI'话搭子'</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #0a192f;
            color: #ffffff;
            overflow: hidden;
        }
        .slide-container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #0a192f 0%, #172a45 100%);
        }
        .tech-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(0, 149, 255, 0.3) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 60px 80px;
        }
        .title {
            font-size: 50px;
            font-weight: 700;
            margin-bottom: 40px;
            color: #ffffff;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .main-content {
            display: flex;
            flex: 1;
            gap: 40px;
        }
        .text-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .description {
            font-size: 24px;
            line-height: 1.6;
            color: #a8b2d1;
            margin-bottom: 30px;
        }
        .highlight {
            color: #64ffda;
            font-weight: 500;
        }
        .visual-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .chat-container {
            position: relative;
            width: 400px;
            height: 400px;
        }
        .chatbot {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
            animation: float 3s ease-in-out infinite;
        }
        .chatbot-icon {
            font-size: 50px;
            color: white;
        }
        .user {
            position: absolute;
            top: 20%;
            right: 20%;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(79, 172, 254, 0.5);
        }
        .user-icon {
            font-size: 40px;
            color: white;
        }
        .bubble {
            position: absolute;
            padding: 15px 20px;
            border-radius: 20px;
            font-size: 16px;
            color: white;
            max-width: 200px;
            opacity: 0;
            animation: popIn 0.5s ease-out forwards;
        }
        .bubble-1 {
            top: 30%;
            right: 25%;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            animation-delay: 0.5s;
        }
        .bubble-2 {
            bottom: 35%;
            left: 25%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            animation-delay: 1.5s;
        }
        .bubble-3 {
            top: 45%;
            right: 30%;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            animation-delay: 2.5s;
        }
        .bubble-4 {
            bottom: 50%;
            left: 30%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            animation-delay: 3.5s;
        }
        .bubble::before {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-style: solid;
        }
        .bubble-1::before {
            top: 100%;
            right: 20px;
            border-width: 10px 10px 0 10px;
            border-color: #00f2fe transparent transparent transparent;
        }
        .bubble-2::before {
            bottom: 100%;
            left: 20px;
            border-width: 0 10px 10px 10px;
            border-color: transparent transparent #764ba2 transparent;
        }
        .bubble-3::before {
            top: 100%;
            right: 15px;
            border-width: 10px 10px 0 10px;
            border-color: #00f2fe transparent transparent transparent;
        }
        .bubble-4::before {
            bottom: 100%;
            left: 15px;
            border-width: 0 10px 10px 10px;
            border-color: transparent transparent #764ba2 transparent;
        }
        .chat-features {
            position: absolute;
            top: 10%;
            left: 10%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .feature {
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }
        .feature-1 {
            animation-delay: 0.8s;
        }
        .feature-2 {
            animation-delay: 1.8s;
        }
        .feature-3 {
            animation-delay: 2.8s;
        }
        .feature-icon {
            font-size: 24px;
            color: #64ffda;
        }
        .feature-text {
            font-size: 16px;
            color: #a8b2d1;
        }
        @keyframes float {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(-50%) translateY(-10px);
            }
        }
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            70% {
                opacity: 1;
                transform: scale(1.1);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateX(-20px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="tech-dots"></div>
        <div class="content">
            <h1 class="title">ChatBot：你的AI'话搭子'</h1>
            <div class="main-content">
                <div class="text-content">
                    <p class="description"><span class="highlight">自动对话系统</span>，借<span class="highlight">自然语言处理</span>和<span class="highlight">机器学习</span></p>
                    <p class="description">与人类进行<span class="highlight">智能交流</span></p>
                    <p class="description">像客服、娱乐场景里的<span class="highlight">"线上聊天搭子"</span></p>
                    <p class="description">随时陪你<span class="highlight">唠嗑</span>、<span class="highlight">解疑</span></p>
                </div>
                <div class="visual-content">
                    <div class="chat-container">
                        <div class="user">
                            <i class="material-icons user-icon">person</i>
                        </div>
                        <div class="chatbot">
                            <i class="material-icons chatbot-icon">chat</i>
                        </div>
                        <div class="bubble bubble-1">你好，能帮我解答一个问题吗？</div>
                        <div class="bubble bubble-2">当然可以！请问有什么需要帮助的？</div>
                        <div class="bubble bubble-3">我想了解大模型的基本概念</div>
                        <div class="bubble bubble-4">大模型是指参数规模庞大的AI模型...</div>
                        <div class="chat-features">
                            <div class="feature feature-1">
                                <i class="material-icons feature-icon">question_answer</i>
                                <span class="feature-text">智能问答</span>
                            </div>
                            <div class="feature feature-2">
                                <i class="material-icons feature-icon">support_agent</i>
                                <span class="feature-text">客服支持</span>
                            </div>
                            <div class="feature feature-3">
                                <i class="material-icons feature-icon">psychology</i>
                                <span class="feature-text">情感陪伴</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
