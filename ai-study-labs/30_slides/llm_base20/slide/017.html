<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG：给AI装'外挂大脑'</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #0a192f;
            color: #ffffff;
            overflow: hidden;
        }
        .slide-container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #0a192f 0%, #172a45 100%);
        }
        .tech-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(0, 149, 255, 0.3) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 60px 80px;
        }
        .title {
            font-size: 50px;
            font-weight: 700;
            margin-bottom: 40px;
            color: #ffffff;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .main-content {
            display: flex;
            flex: 1;
            gap: 40px;
        }
        .text-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .description {
            font-size: 24px;
            line-height: 1.6;
            color: #a8b2d1;
            margin-bottom: 30px;
        }
        .highlight {
            color: #64ffda;
            font-weight: 500;
        }
        .visual-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .rag-container {
            position: relative;
            width: 400px;
            height: 400px;
        }
        .knowledge-base {
            position: absolute;
            top: 20%;
            left: 20%;
            width: 100px;
            height: 100px;
            border-radius: 15px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.5);
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
            animation-delay: 0.5s;
        }
        .knowledge-icon {
            font-size: 40px;
            color: white;
            margin-bottom: 5px;
        }
        .knowledge-label {
            font-size: 14px;
            font-weight: 500;
            color: white;
            text-align: center;
        }
        .retriever {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.5);
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
            animation-delay: 1s;
        }
        .retriever-icon {
            font-size: 40px;
            color: white;
        }
        .generator {
            position: absolute;
            bottom: 20%;
            right: 20%;
            width: 100px;
            height: 100px;
            border-radius: 15px;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(250, 112, 154, 0.5);
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
            animation-delay: 1.5s;
        }
        .generator-icon {
            font-size: 40px;
            color: white;
            margin-bottom: 5px;
        }
        .generator-label {
            font-size: 14px;
            font-weight: 500;
            color: white;
            text-align: center;
        }
        .connection {
            position: absolute;
            background: rgba(100, 255, 218, 0.3);
            opacity: 0;
            animation: connect 1.5s ease-in-out forwards;
        }
        .connection-1 {
            width: 4px;
            height: 80px;
            top: 30%;
            left: 30%;
            transform: rotate(45deg);
            transform-origin: top left;
            animation-delay: 1.2s;
        }
        .connection-2 {
            width: 4px;
            height: 80px;
            bottom: 30%;
            right: 30%;
            transform: rotate(-45deg);
            transform-origin: bottom right;
            animation-delay: 1.7s;
        }
        .data-flow {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: rgba(100, 255, 218, 0.7);
            opacity: 0;
            animation: flow 3s ease-in-out infinite;
        }
        .flow-1 {
            top: 40%;
            left: 30%;
            animation-delay: 1.4s;
        }
        .flow-2 {
            bottom: 40%;
            right: 30%;
            animation-delay: 1.9s;
        }
        .process-label {
            position: absolute;
            font-size: 16px;
            font-weight: 500;
            color: #a8b2d1;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }
        .label-1 {
            top: 10%;
            left: 15%;
            animation-delay: 1s;
        }
        .label-2 {
            top: 45%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 1.5s;
        }
        .label-3 {
            bottom: 10%;
            right: 15%;
            animation-delay: 2s;
        }
        .enhanced-output {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            font-weight: 500;
            color: #64ffda;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
            animation-delay: 2.5s;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes connect {
            0% {
                opacity: 0;
                height: 0;
            }
            100% {
                opacity: 1;
                height: 80px;
            }
        }
        @keyframes flow {
            0% {
                opacity: 0;
                transform: scale(0);
            }
            20% {
                opacity: 1;
                transform: scale(1);
            }
            80% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0);
            }
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="tech-dots"></div>
        <div class="content">
            <h1 class="title">RAG：给AI装'外挂大脑'</h1>
            <div class="main-content">
                <div class="text-content">
                    <p class="description">结合<span class="highlight">检索</span>和<span class="highlight">生成</span>的方法</p>
                    <p class="description">从<span class="highlight">知识库</span>检索相关信息，再生成回答</p>
                    <p class="description">像AI先查<span class="highlight">"资料库"</span>再回答</p>
                    <p class="description">让回答<span class="highlight">更准确可靠</span>，减少幻觉</p>
                </div>
                <div class="visual-content">
                    <div class="rag-container">
                        <div class="knowledge-base">
                            <i class="material-icons knowledge-icon">storage</i>
                            <span class="knowledge-label">知识库</span>
                        </div>
                        <div class="retriever">
                            <i class="material-icons retriever-icon">search</i>
                        </div>
                        <div class="generator">
                            <i class="material-icons generator-icon">auto_awesome</i>
                            <span class="generator-label">生成模型</span>
                        </div>
                        <div class="connection connection-1"></div>
                        <div class="connection connection-2"></div>
                        <div class="data-flow flow-1"></div>
                        <div class="data-flow flow-2"></div>
                        <div class="process-label label-1">检索</div>
                        <div class="process-label label-2">增强</div>
                        <div class="process-label label-3">生成</div>
                        <div class="enhanced-output">检索 + 生成 = 更可靠回答</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
