<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoT：给AI装'思考清单'</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #0a192f;
            color: #ffffff;
            overflow: hidden;
        }
        .slide-container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #0a192f 0%, #172a45 100%);
        }
        .tech-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(0, 149, 255, 0.3) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 60px 80px;
        }
        .title {
            font-size: 50px;
            font-weight: 700;
            margin-bottom: 40px;
            color: #ffffff;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .main-content {
            display: flex;
            flex: 1;
            gap: 40px;
        }
        .text-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .description {
            font-size: 24px;
            line-height: 1.6;
            color: #a8b2d1;
            margin-bottom: 30px;
        }
        .highlight {
            color: #64ffda;
            font-weight: 500;
        }
        .visual-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .cot-container {
            position: relative;
            width: 400px;
            height: 400px;
        }
        .ai-brain {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }
        .ai-icon {
            font-size: 60px;
            color: white;
        }
        .step {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }
        .step-number {
            font-size: 24px;
            font-weight: 700;
            color: white;
            margin-bottom: 5px;
        }
        .step-icon {
            font-size: 36px;
            color: white;
        }
        .step-1 {
            top: 10%;
            left: 20%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 10px 20px rgba(245, 87, 108, 0.5);
            animation-delay: 0.5s;
        }
        .step-2 {
            top: 10%;
            right: 20%;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.5);
            animation-delay: 1.5s;
        }
        .step-3 {
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            box-shadow: 0 10px 20px rgba(250, 112, 154, 0.5);
            animation-delay: 2.5s;
        }
        .connection {
            position: absolute;
            background: rgba(100, 255, 218, 0.3);
            opacity: 0;
            animation: connect 1.5s ease-in-out forwards;
        }
        .connection-1 {
            width: 4px;
            height: 100px;
            top: 25%;
            left: 30%;
            transform: rotate(45deg);
            transform-origin: top left;
            animation-delay: 1s;
        }
        .connection-2 {
            width: 4px;
            height: 100px;
            top: 25%;
            right: 30%;
            transform: rotate(-45deg);
            transform-origin: top right;
            animation-delay: 2s;
        }
        .connection-3 {
            width: 4px;
            height: 80px;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 3s;
        }
        .step-label {
            position: absolute;
            font-size: 16px;
            font-weight: 500;
            color: white;
            text-align: center;
            width: 120px;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }
        .label-1 {
            top: 5%;
            left: 10%;
            animation-delay: 1s;
        }
        .label-2 {
            top: 5%;
            right: 10%;
            animation-delay: 2s;
        }
        .label-3 {
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 3s;
        }
        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.05);
                box-shadow: 0 15px 40px rgba(102, 126, 234, 0.7);
            }
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes connect {
            0% {
                opacity: 0;
                height: 0;
            }
            100% {
                opacity: 1;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="tech-dots"></div>
        <div class="content">
            <h1 class="title">CoT：给AI装'思考清单'</h1>
            <div class="main-content">
                <div class="text-content">
                    <p class="description">指导<span class="highlight">预训练语言模型</span>生成更<span class="highlight">准确</span>、<span class="highlight">逻辑强</span>输出的方法</p>
                    <p class="description">给模型列<span class="highlight">"思考步骤"</span></p>
                    <p class="description">比如解数学题时，让AI按<span class="highlight">"先理条件、再找公式、最后计算"</span>步骤思考</p>
                    <p class="description">使AI输出更有<span class="highlight">条理性</span>和<span class="highlight">可解释性</span></p>
                </div>
                <div class="visual-content">
                    <div class="cot-container">
                        <div class="ai-brain">
                            <i class="material-icons ai-icon">psychology</i>
                        </div>
                        <div class="step step-1">
                            <div class="step-number">1</div>
                            <i class="material-icons step-icon">fact_check</i>
                        </div>
                        <div class="step step-2">
                            <div class="step-number">2</div>
                            <i class="material-icons step-icon">search</i>
                        </div>
                        <div class="step step-3">
                            <div class="step-number">3</div>
                            <i class="material-icons step-icon">calculate</i>
                        </div>
                        <div class="connection connection-1"></div>
                        <div class="connection connection-2"></div>
                        <div class="connection connection-3"></div>
                        <div class="step-label label-1">理清条件</div>
                        <div class="step-label label-2">寻找公式</div>
                        <div class="step-label label-3">计算结果</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
