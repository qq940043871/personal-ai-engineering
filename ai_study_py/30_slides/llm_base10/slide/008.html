<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parameters（参数）</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            overflow: hidden;
        }
        .slide {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: linear-gradient(135deg, #0a2463, #1e3a8a, #3b82f6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.15;
            background-image: url('https://picsum.photos/seed/neural-network-abstract/1280/720.jpg');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: 2;
        }
        .content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            padding: 60px 80px;
            flex-grow: 1;
        }
        .title {
            font-size: 56px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 40px;
            letter-spacing: 1px;
            opacity: 0;
            transform: translateX(-50px);
            animation: slideInFromLeft 0.8s ease-out forwards;
        }
        .section {
            margin-bottom: 30px;
            opacity: 0;
        }
        .section-title {
            font-size: 24px;
            font-weight: 700;
            color: #a5f3fc;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        .section-title .material-icons {
            margin-right: 10px;
            font-size: 28px;
        }
        .section-content {
            font-size: 20px;
            color: #ffffff;
            line-height: 1.6;
            padding-left: 38px;
        }
        .section-content li {
            margin-bottom: 10px;
            list-style-type: none;
            position: relative;
        }
        .section-content li:before {
            content: "•";
            color: #38bdf8;
            font-weight: bold;
            position: absolute;
            left: -20px;
        }
        .highlight {
            color: #fbbf24;
            font-weight: 700;
        }
        .importance {
            background: rgba(59, 130, 246, 0.2);
            border-left: 4px solid #fbbf24;
            padding: 15px 20px;
            border-radius: 0 8px 8px 0;
            margin-top: 20px;
        }
        .importance .section-content {
            padding-left: 0;
        }
        .importance .section-content li:before {
            display: none;
        }
        .parameter-visual {
            position: absolute;
            right: 80px;
            top: 50%;
            transform: translateY(-50%);
            width: 450px;
            height: 400px;
            opacity: 0;
            animation: fadeIn 1s ease-out 1s forwards;
        }
        .parameter-diagram {
            position: relative;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
            overflow: hidden;
            padding: 20px;
        }
        .model-comparison {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }
        .model-item {
            display: flex;
            align-items: center;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }
        .small-model {
            animation-delay: 1.5s;
        }
        .medium-model {
            animation-delay: 1.7s;
        }
        .large-model {
            animation-delay: 1.9s;
        }
        .model-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 20px;
            flex-shrink: 0;
        }
        .small-icon {
            background: rgba(59, 130, 246, 0.3);
            border: 2px solid #38bdf8;
        }
        .medium-icon {
            background: rgba(251, 191, 36, 0.3);
            border: 2px solid #fbbf24;
            width: 80px;
            height: 80px;
        }
        .large-icon {
            background: rgba(34, 197, 94, 0.3);
            border: 2px solid #22c55e;
            width: 100px;
            height: 100px;
        }
        .model-info {
            flex-grow: 1;
        }
        .model-name {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 5px;
        }
        .model-params {
            font-size: 16px;
            color: #a5f3fc;
        }
        .param-bar {
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            margin-top: 8px;
            overflow: hidden;
            position: relative;
        }
        .param-fill {
            height: 100%;
            border-radius: 5px;
            width: 0;
            animation: fillBar 1.5s ease-out forwards;
        }
        .small-fill {
            background: #38bdf8;
            animation-delay: 2.1s;
        }
        .medium-fill {
            background: #fbbf24;
            animation-delay: 2.3s;
        }
        .large-fill {
            background: #22c55e;
            animation-delay: 2.5s;
        }
        
        @keyframes slideInFromLeft {
            0% {
                opacity: 0;
                transform: translateX(-50px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes fillBar {
            0% {
                width: 0;
            }
            100% {
                width: var(--bar-width);
            }
        }
    </style>
</head>
<body>
    <div class="slide">
        <div class="background"></div>
        <div class="grid-overlay"></div>
        <div class="content">
            <h1 class="title">Parameters（参数）</h1>
            
            <div class="section" style="animation: fadeIn 0.8s ease-out 0.5s forwards;">
                <div class="section-title">
                    <i class="material-icons">lightbulb</i>一句话解释
                </div>
                <div class="section-content">
                    模型内部的"<span class="highlight">旋钮</span>"，数量代表模型规模。
                </div>
            </div>
            
            <div class="section" style="animation: fadeIn 0.8s ease-out 0.8s forwards;">
                <div class="section-title">
                    <i class="material-icons">info</i>详细说明
                </div>
                <div class="section-content">
                    <ul>
                        <li style="animation: popIn 0.5s ease-out 1.1s forwards; opacity: 0;">参数存储<span class="highlight">知识和能力</span>。</li>
                        <li style="animation: popIn 0.5s ease-out 1.3s forwards; opacity: 0;">如GPT-3有<span class="highlight">1750亿</span>参数。</li>
                    </ul>
                </div>
            </div>
            
            <div class="section importance" style="animation: fadeIn 0.8s ease-out 1.5s forwards;">
                <div class="section-title">
                    <i class="material-icons">star</i>为什么重要
                </div>
                <div class="section-content">
                    <ul>
                        <li>参数量决定模型的<span class="highlight">上限</span>。</li>
                    </ul>
                </div>
            </div>
        </div>
        
        <div class="parameter-visual">
            <div class="parameter-diagram">
                <div class="model-comparison">
                    <div class="model-item small-model">
                        <div class="model-icon small-icon">
                            <i class="material-icons" style="font-size: 32px; color: #ffffff;">memory</i>
                        </div>
                        <div class="model-info">
                            <div class="model-name">小模型</div>
                            <div class="model-params">1亿参数</div>
                            <div class="param-bar">
                                <div class="param-fill small-fill" style="--bar-width: 20%;"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="model-item medium-model">
                        <div class="model-icon medium-icon">
                            <i class="material-icons" style="font-size: 40px; color: #ffffff;">memory</i>
                        </div>
                        <div class="model-info">
                            <div class="model-name">中型模型</div>
                            <div class="model-params">130亿参数</div>
                            <div class="param-bar">
                                <div class="param-fill medium-fill" style="--bar-width: 60%;"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="model-item large-model">
                        <div class="model-icon large-icon">
                            <i class="material-icons" style="font-size: 48px; color: #ffffff;">memory</i>
                        </div>
                        <div class="model-info">
                            <div class="model-name">大模型</div>
                            <div class="model-params">1750亿参数</div>
                            <div class="param-bar">
                                <div class="param-fill large-fill" style="--bar-width: 100%;"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
