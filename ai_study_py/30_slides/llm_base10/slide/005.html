<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-training（预训练）</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            overflow: hidden;
        }
        .slide {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: linear-gradient(135deg, #0a2463, #1e3a8a, #3b82f6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.15;
            background-image: url('https://picsum.photos/seed/neural-network-abstract/1280/720.jpg');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: 2;
        }
        .content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            padding: 60px 80px;
            flex-grow: 1;
        }
        .title {
            font-size: 56px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 40px;
            letter-spacing: 1px;
            opacity: 0;
            transform: translateX(-50px);
            animation: slideInFromLeft 0.8s ease-out forwards;
        }
        .section {
            margin-bottom: 30px;
            opacity: 0;
        }
        .section-title {
            font-size: 24px;
            font-weight: 700;
            color: #a5f3fc;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        .section-title .material-icons {
            margin-right: 10px;
            font-size: 28px;
        }
        .section-content {
            font-size: 20px;
            color: #ffffff;
            line-height: 1.6;
            padding-left: 38px;
        }
        .section-content li {
            margin-bottom: 10px;
            list-style-type: none;
            position: relative;
        }
        .section-content li:before {
            content: "•";
            color: #38bdf8;
            font-weight: bold;
            position: absolute;
            left: -20px;
        }
        .highlight {
            color: #fbbf24;
            font-weight: 700;
        }
        .importance {
            background: rgba(59, 130, 246, 0.2);
            border-left: 4px solid #fbbf24;
            padding: 15px 20px;
            border-radius: 0 8px 8px 0;
            margin-top: 20px;
        }
        .importance .section-content {
            padding-left: 0;
        }
        .importance .section-content li:before {
            display: none;
        }
        .data-flow-visual {
            position: absolute;
            right: 80px;
            top: 50%;
            transform: translateY(-50%);
            width: 400px;
            height: 400px;
            opacity: 0;
            animation: fadeIn 1s ease-out 1s forwards;
        }
        .data-flow-diagram {
            position: relative;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
            overflow: hidden;
            padding: 20px;
        }
        .data-source {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 14px;
            text-align: center;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }
        .books {
            left: 40px;
            top: 60px;
            background: rgba(59, 130, 246, 0.3);
            animation-delay: 1.5s;
        }
        .web {
            left: 40px;
            top: 160px;
            background: rgba(59, 130, 246, 0.3);
            animation-delay: 1.7s;
        }
        .articles {
            left: 40px;
            top: 260px;
            background: rgba(59, 130, 246, 0.3);
            animation-delay: 1.9s;
        }
        .model {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            width: 120px;
            height: 120px;
            background: rgba(251, 191, 36, 0.3);
            border: 2px solid #fbbf24;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fbbf24;
            font-weight: 700;
            font-size: 16px;
            text-align: center;
            opacity: 0;
            animation: pulseHighlight 1s ease-out 2.1s forwards;
        }
        .flow-arrow {
            position: absolute;
            height: 2px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            animation: flowAnimation 1.5s ease-out forwards;
        }
        .flow-arrow::after {
            content: '';
            position: absolute;
            right: 0;
            top: -4px;
            width: 0;
            height: 0;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 10px solid rgba(255, 255, 255, 0.5);
        }
        .arrow-1 {
            left: 120px;
            top: 100px;
            width: 160px;
            animation-delay: 2.3s;
        }
        .arrow-2 {
            left: 120px;
            top: 200px;
            width: 160px;
            animation-delay: 2.5s;
        }
        .arrow-3 {
            left: 120px;
            top: 300px;
            width: 160px;
            animation-delay: 2.7s;
        }
        .data-icon {
            font-size: 36px;
            margin-bottom: 5px;
        }
        
        @keyframes slideInFromLeft {
            0% {
                opacity: 0;
                transform: translateX(-50px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes pulseHighlight {
            0% {
                opacity: 0;
                transform: translateY(-50%) scale(0.8);
            }
            50% {
                opacity: 1;
                transform: translateY(-50%) scale(1.1);
            }
            100% {
                opacity: 1;
                transform: translateY(-50%) scale(1);
            }
        }
        @keyframes flowAnimation {
            0% {
                opacity: 0;
                width: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 1;
                width: 160px;
            }
        }
    </style>
</head>
<body>
    <div class="slide">
        <div class="background"></div>
        <div class="grid-overlay"></div>
        <div class="content">
            <h1 class="title">Pre-training（预训练）</h1>
            
            <div class="section" style="animation: fadeIn 0.8s ease-out 0.5s forwards;">
                <div class="section-title">
                    <i class="material-icons">lightbulb</i>一句话解释
                </div>
                <div class="section-content">
                    模型在海量数据上的"<span class="highlight">通识教育</span>"。
                </div>
            </div>
            
            <div class="section" style="animation: fadeIn 0.8s ease-out 0.8s forwards;">
                <div class="section-title">
                    <i class="material-icons">info</i>详细说明
                </div>
                <div class="section-content">
                    <ul>
                        <li style="animation: popIn 0.5s ease-out 1.1s forwards; opacity: 0;">学习语言规律和<span class="highlight">世界知识</span>。</li>
                        <li style="animation: popIn 0.5s ease-out 1.3s forwards; opacity: 0;">打造能力强大的<span class="highlight">基础模型</span>。</li>
                    </ul>
                </div>
            </div>
            
            <div class="section importance" style="animation: fadeIn 0.8s ease-out 1.5s forwards;">
                <div class="section-title">
                    <i class="material-icons">star</i>为什么重要
                </div>
                <div class="section-content">
                    <ul>
                        <li>是模型具备<span class="highlight">通用智能</span>的前提。</li>
                    </ul>
                </div>
            </div>
        </div>
        
        <div class="data-flow-visual">
            <div class="data-flow-diagram">
                <div class="data-source books">
                    <div>
                        <i class="material-icons data-icon">menu_book</i>
                        <div>书籍</div>
                    </div>
                </div>
                <div class="data-source web">
                    <div>
                        <i class="material-icons data-icon">language</i>
                        <div>网页</div>
                    </div>
                </div>
                <div class="data-source articles">
                    <div>
                        <i class="material-icons data-icon">article</i>
                        <div>文章</div>
                    </div>
                </div>
                <div class="model">大模型</div>
                <div class="flow-arrow arrow-1"></div>
                <div class="flow-arrow arrow-2"></div>
                <div class="flow-arrow arrow-3"></div>
            </div>
        </div>
    </div>
</body>
</html>
