<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多模态：让AI感知'多彩世界'</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #0a192f;
            color: #ffffff;
            overflow: hidden;
        }
        .slide-container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #0a192f 0%, #172a45 100%);
        }
        .tech-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(0, 149, 255, 0.3) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 60px 80px;
        }
        .title {
            font-size: 50px;
            font-weight: 700;
            margin-bottom: 40px;
            color: #ffffff;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .main-content {
            display: flex;
            flex: 1;
            gap: 40px;
        }
        .text-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .description {
            font-size: 24px;
            line-height: 1.6;
            color: #a8b2d1;
            margin-bottom: 30px;
        }
        .highlight {
            color: #64ffda;
            font-weight: 500;
        }
        .visual-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .brain-container {
            position: relative;
            width: 300px;
            height: 300px;
        }
        .brain {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
            opacity: 0;
            animation: fadeIn 1s ease-in-out 1.5s forwards;
        }
        .brain-icon {
            font-size: 80px;
            color: white;
        }
        .modal {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            animation: floatIn 1s ease-in-out forwards;
        }
        .modal-icon {
            font-size: 36px;
            color: white;
            margin-bottom: 5px;
        }
        .modal-label {
            font-size: 14px;
            font-weight: 500;
            color: white;
            text-align: center;
        }
        .image-modal {
            top: 20%;
            left: 20%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 10px 20px rgba(245, 87, 108, 0.5);
            animation-delay: 0.2s;
        }
        .text-modal {
            top: 20%;
            right: 20%;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.5);
            animation-delay: 0.6s;
        }
        .audio-modal {
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            box-shadow: 0 10px 20px rgba(250, 112, 154, 0.5);
            animation-delay: 1s;
        }
        .connection {
            position: absolute;
            background: rgba(100, 255, 218, 0.3);
            opacity: 0;
            animation: connect 1.5s ease-in-out forwards;
        }
        .connection-1 {
            width: 4px;
            height: 100px;
            top: 30%;
            left: 30%;
            transform: rotate(45deg);
            transform-origin: top left;
            animation-delay: 1.2s;
        }
        .connection-2 {
            width: 4px;
            height: 100px;
            top: 30%;
            right: 30%;
            transform: rotate(-45deg);
            transform-origin: top right;
            animation-delay: 1.4s;
        }
        .connection-3 {
            width: 4px;
            height: 80px;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 1.6s;
        }
        @keyframes floatIn {
            0% {
                opacity: 0;
                transform: scale(0) translateY(20px);
            }
            70% {
                opacity: 1;
                transform: scale(1.1) translateY(-5px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        @keyframes connect {
            0% {
                opacity: 0;
                height: 0;
            }
            100% {
                opacity: 1;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="tech-dots"></div>
        <div class="content">
            <h1 class="title">多模态：让AI感知'多彩世界'</h1>
            <div class="main-content">
                <div class="text-content">
                    <p class="description">机器学习里用<span class="highlight">多种模态</span>数据组合的深度学习类型</p>
                    <p class="description">融合<span class="highlight">图像</span> + <span class="highlight">文本</span> + <span class="highlight">声音</span>等多种数据形式</p>
                    <p class="description">帮AI像人类一样<span class="highlight">"看、听、读"</span></p>
                    <p class="description">比如让AI理解视频里的<span class="highlight">画面</span> + <span class="highlight">台词</span> + <span class="highlight">背景音乐</span></p>
                </div>
                <div class="visual-content">
                    <div class="brain-container">
                        <div class="modal image-modal">
                            <i class="material-icons modal-icon">image</i>
                            <span class="modal-label">图像</span>
                        </div>
                        <div class="modal text-modal">
                            <i class="material-icons modal-icon">text_fields</i>
                            <span class="modal-label">文本</span>
                        </div>
                        <div class="modal audio-modal">
                            <i class="material-icons modal-icon">volume_up</i>
                            <span class="modal-label">声音</span>
                        </div>
                        <div class="connection connection-1"></div>
                        <div class="connection connection-2"></div>
                        <div class="connection connection-3"></div>
                        <div class="brain">
                            <i class="material-icons brain-icon">psychology</i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
