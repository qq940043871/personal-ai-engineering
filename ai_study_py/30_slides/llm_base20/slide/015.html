<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预训练：模型的'知识打底期'</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #0a192f;
            color: #ffffff;
            overflow: hidden;
        }
        .slide-container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #0a192f 0%, #172a45 100%);
        }
        .tech-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(0, 149, 255, 0.3) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 60px 80px;
        }
        .title {
            font-size: 50px;
            font-weight: 700;
            margin-bottom: 40px;
            color: #ffffff;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .main-content {
            display: flex;
            flex: 1;
            gap: 40px;
        }
        .text-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .description {
            font-size: 24px;
            line-height: 1.6;
            color: #a8b2d1;
            margin-bottom: 30px;
        }
        .highlight {
            color: #64ffda;
            font-weight: 500;
        }
        .visual-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .pretraining-container {
            position: relative;
            width: 400px;
            height: 400px;
        }
        .model {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
            animation: float 3s ease-in-out infinite;
        }
        .model-icon {
            font-size: 60px;
            color: white;
        }
        .book {
            position: absolute;
            width: 70px;
            height: 90px;
            border-radius: 5px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.5);
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }
        .book-icon {
            font-size: 36px;
            color: white;
        }
        .book-1 {
            bottom: 20%;
            left: 25%;
            transform: rotate(-5deg);
            animation-delay: 0.5s;
        }
        .book-2 {
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 1s;
        }
        .book-3 {
            bottom: 20%;
            right: 25%;
            transform: rotate(5deg);
            animation-delay: 1.5s;
        }
        .book-4 {
            bottom: 35%;
            left: 30%;
            transform: rotate(-3deg);
            animation-delay: 2s;
        }
        .book-5 {
            bottom: 35%;
            right: 30%;
            transform: rotate(3deg);
            animation-delay: 2.5s;
        }
        .foundation {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 10px;
            background: linear-gradient(90deg, rgba(100, 255, 218, 0.3), rgba(100, 255, 218, 0.7), rgba(100, 255, 218, 0.3));
            border-radius: 5px;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
            animation-delay: 3s;
        }
        .knowledge-flow {
            position: absolute;
            width: 4px;
            height: 80px;
            background: linear-gradient(to bottom, rgba(100, 255, 218, 0.7), rgba(100, 255, 218, 0.3));
            opacity: 0;
            animation: flow 2s ease-in-out infinite;
        }
        .flow-1 {
            top: 45%;
            left: 35%;
            animation-delay: 0.7s;
        }
        .flow-2 {
            top: 45%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 1.2s;
        }
        .flow-3 {
            top: 45%;
            right: 35%;
            animation-delay: 1.7s;
        }
        .stage-label {
            position: absolute;
            font-size: 18px;
            font-weight: 500;
            color: #a8b2d1;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }
        .label-1 {
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 0.5s;
        }
        .label-2 {
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 3s;
        }
        @keyframes float {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(-50%) translateY(-10px);
            }
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes flow {
            0% {
                opacity: 0;
                transform: translateY(0);
            }
            50% {
                opacity: 1;
                transform: translateY(20px);
            }
            100% {
                opacity: 0;
                transform: translateY(40px);
            }
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="tech-dots"></div>
        <div class="content">
            <h1 class="title">预训练：模型的'知识打底期'</h1>
            <div class="main-content">
                <div class="text-content">
                    <p class="description"><span class="highlight">特定任务前</span>，在<span class="highlight">大量数据</span>上训练模型</p>
                    <p class="description">提高<span class="highlight">初始性能</span>，为后续任务打基础</p>
                    <p class="description">如同AI先读<span class="highlight">"百科全书"</span>攒知识</p>
                    <p class="description">后续做任务<span class="highlight">更顺手</span>，表现更佳</p>
                </div>
                <div class="visual-content">
                    <div class="pretraining-container">
                        <div class="model">
                            <i class="material-icons model-icon">psychology</i>
                        </div>
                        <div class="book book-1">
                            <i class="material-icons book-icon">menu_book</i>
                        </div>
                        <div class="book book-2">
                            <i class="material-icons book-icon">menu_book</i>
                        </div>
                        <div class="book book-3">
                            <i class="material-icons book-icon">menu_book</i>
                        </div>
                        <div class="book book-4">
                            <i class="material-icons book-icon">menu_book</i>
                        </div>
                        <div class="book book-5">
                            <i class="material-icons book-icon">menu_book</i>
                        </div>
                        <div class="foundation"></div>
                        <div class="knowledge-flow flow-1"></div>
                        <div class="knowledge-flow flow-2"></div>
                        <div class="knowledge-flow flow-3"></div>
                        <div class="stage-label label-1">模型学习</div>
                        <div class="stage-label label-2">知识地基</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
