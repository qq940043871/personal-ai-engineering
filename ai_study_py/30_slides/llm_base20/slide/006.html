<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对齐：让AI走'正道'</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #0a192f;
            color: #ffffff;
            overflow: hidden;
        }
        .slide-container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #0a192f 0%, #172a45 100%);
        }
        .tech-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(0, 149, 255, 0.3) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 60px 80px;
        }
        .title {
            font-size: 50px;
            font-weight: 700;
            margin-bottom: 40px;
            color: #ffffff;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .main-content {
            display: flex;
            flex: 1;
            gap: 40px;
        }
        .text-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .description {
            font-size: 24px;
            line-height: 1.6;
            color: #a8b2d1;
            margin-bottom: 30px;
        }
        .highlight {
            color: #64ffda;
            font-weight: 500;
        }
        .visual-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .alignment-container {
            position: relative;
            width: 400px;
            height: 400px;
        }
        .target {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }
        .target-icon {
            font-size: 60px;
            color: white;
        }
        .ai-system {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(79, 172, 254, 0.5);
            animation: float 3s ease-in-out infinite;
        }
        .ai-icon {
            font-size: 50px;
            color: white;
        }
        .arrow {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            animation: fadeIn 1s ease-in-out 0.5s forwards;
        }
        .arrow-line {
            width: 6px;
            height: 120px;
            background: linear-gradient(to bottom, rgba(100, 255, 218, 0.7), rgba(100, 255, 218, 0.3));
            border-radius: 3px;
        }
        .arrow-head {
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 30px solid rgba(100, 255, 218, 0.7);
        }
        .alignment-label {
            position: absolute;
            top: 50%;
            left: 65%;
            transform: translateY(-50%);
            font-size: 20px;
            font-weight: 500;
            color: #64ffda;
            opacity: 0;
            animation: fadeIn 1s ease-in-out 1s forwards;
        }
        .misaligned {
            position: absolute;
            bottom: 20%;
            left: 20%;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.5);
            opacity: 0;
            animation: misalignedMove 3s ease-in-out infinite;
        }
        .misaligned-icon {
            font-size: 40px;
            color: white;
        }
        .misaligned-arrow {
            position: absolute;
            bottom: 30%;
            left: 25%;
            width: 30px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: rotate(-30deg);
            opacity: 0;
            animation: fadeIn 1s ease-in-out 1.5s forwards;
        }
        .misaligned-line {
            width: 4px;
            height: 60px;
            background: linear-gradient(to bottom, rgba(245, 87, 108, 0.7), rgba(245, 87, 108, 0.3));
            border-radius: 2px;
        }
        .misaligned-head {
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 20px solid rgba(245, 87, 108, 0.7);
        }
        .misaligned-label {
            position: absolute;
            bottom: 10%;
            left: 10%;
            font-size: 18px;
            font-weight: 500;
            color: #f5576c;
            opacity: 0;
            animation: fadeIn 1s ease-in-out 2s forwards;
        }
        @keyframes pulse {
            0%, 100% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
            }
            50% {
                transform: translateX(-50%) scale(1.05);
                box-shadow: 0 15px 40px rgba(102, 126, 234, 0.7);
            }
        }
        @keyframes float {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(-50%) translateY(-10px);
            }
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        @keyframes misalignedMove {
            0%, 100% {
                transform: translate(0, 0);
            }
            25% {
                transform: translate(20px, -10px);
            }
            50% {
                transform: translate(-10px, 10px);
            }
            75% {
                transform: translate(15px, 5px);
            }
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="tech-dots"></div>
        <div class="content">
            <h1 class="title">对齐：让AI走'正道'</h1>
            <div class="main-content">
                <div class="text-content">
                    <p class="description">若AI系统<span class="highlight">推进预定目标</span>，就是<span class="highlight">对齐</span>的系统</p>
                    <p class="description"><span class="highlight">未对齐</span>就可能<span class="highlight">"乱跑"</span></p>
                    <p class="description">好比给AI装<span class="highlight">"目标导航"</span></p>
                    <p class="description">确保它做的事<span class="highlight">符合设定方向</span></p>
                </div>
                <div class="visual-content">
                    <div class="alignment-container">
                        <div class="target">
                            <i class="material-icons target-icon">track_changes</i>
                        </div>
                        <div class="ai-system">
                            <i class="material-icons ai-icon">smart_toy</i>
                        </div>
                        <div class="arrow">
                            <div class="arrow-line"></div>
                            <div class="arrow-head"></div>
                        </div>
                        <div class="alignment-label">对齐</div>
                        
                        <div class="misaligned">
                            <i class="material-icons misaligned-icon">help_outline</i>
                        </div>
                        <div class="misaligned-arrow">
                            <div class="misaligned-line"></div>
                            <div class="misaligned-head"></div>
                        </div>
                        <div class="misaligned-label">未对齐</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
