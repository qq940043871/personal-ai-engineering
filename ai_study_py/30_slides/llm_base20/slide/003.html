<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAN：AI界的'创作者VS裁判'</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #0a192f;
            color: #ffffff;
            overflow: hidden;
        }
        .slide-container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #0a192f 0%, #172a45 100%);
        }
        .tech-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(0, 149, 255, 0.3) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 60px 80px;
        }
        .title {
            font-size: 50px;
            font-weight: 700;
            margin-bottom: 40px;
            color: #ffffff;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .main-content {
            display: flex;
            flex: 1;
            gap: 40px;
        }
        .text-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .description {
            font-size: 24px;
            line-height: 1.6;
            color: #a8b2d1;
            margin-bottom: 30px;
        }
        .highlight {
            color: #64ffda;
            font-weight: 500;
        }
        .visual-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .gan-container {
            position: relative;
            width: 100%;
            height: 400px;
        }
        .character {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: float 3s ease-in-out infinite;
        }
        .generator {
            left: 20%;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
            animation-delay: 0.5s;
        }
        .discriminator {
            right: 20%;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.5);
            animation-delay: 1.5s;
        }
        .character-icon {
            font-size: 50px;
            color: white;
            margin-bottom: 5px;
        }
        .character-label {
            font-size: 16px;
            font-weight: 500;
            color: white;
        }
        .interaction {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .vs-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: 700;
            color: #64ffda;
            border: 2px solid #64ffda;
            animation: pulse 2s ease-in-out infinite;
        }
        .data-flow {
            position: absolute;
            height: 4px;
            background: linear-gradient(90deg, rgba(100, 255, 218, 0) 0%, rgba(100, 255, 218, 1) 50%, rgba(100, 255, 218, 0) 100%);
            opacity: 0;
            animation: flow 3s ease-in-out infinite;
        }
        .flow-1 {
            top: 40%;
            left: 25%;
            width: 50%;
            animation-delay: 0.5s;
        }
        .flow-2 {
            top: 60%;
            left: 25%;
            width: 50%;
            animation-delay: 2s;
        }
        @keyframes float {
            0%, 100% {
                transform: translateY(-50%);
            }
            50% {
                transform: translateY(-60%);
            }
        }
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.1);
                opacity: 1;
            }
        }
        @keyframes flow {
            0% {
                opacity: 0;
                transform: translateX(-100%);
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateX(100%);
            }
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="tech-dots"></div>
        <div class="content">
            <h1 class="title">GAN：AI界的'创作者VS裁判'</h1>
            <div class="main-content">
                <div class="text-content">
                    <p class="description">一类<span class="highlight">机器学习框架</span>，包含两个关键角色：</p>
                    <p class="description"><span class="highlight">生成器</span>："搞创作"生成内容</p>
                    <p class="description"><span class="highlight">判别器</span>："当评委"辨真假</p>
                    <p class="description">共同推动<span class="highlight">生成式AI</span>进步</p>
                    <p class="description">就像在AI世界办<span class="highlight">"创意擂台"</span></p>
                </div>
                <div class="visual-content">
                    <div class="gan-container">
                        <div class="character generator">
                            <i class="material-icons character-icon">brush</i>
                            <span class="character-label">生成器</span>
                        </div>
                        <div class="character discriminator">
                            <i class="material-icons character-icon">gavel</i>
                            <span class="character-label">判别器</span>
                        </div>
                        <div class="interaction">
                            <div class="vs-circle">VS</div>
                        </div>
                        <div class="data-flow flow-1"></div>
                        <div class="data-flow flow-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
