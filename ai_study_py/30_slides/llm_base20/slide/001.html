<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大模型科普——AI世界的关键密码</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #0a192f;
            color: #ffffff;
            overflow: hidden;
        }
        .slide-container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #0a192f 0%, #172a45 100%);
        }
        .tech-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }
        .tech-line {
            position: absolute;
            background: linear-gradient(90deg, rgba(0, 149, 255, 0) 0%, rgba(0, 149, 255, 0.7) 50%, rgba(0, 149, 255, 0) 100%);
            height: 2px;
            width: 100%;
            animation: flow 8s linear infinite;
        }
        .tech-line:nth-child(1) {
            top: 20%;
            animation-delay: 0s;
        }
        .tech-line:nth-child(2) {
            top: 40%;
            animation-delay: 2s;
        }
        .tech-line:nth-child(3) {
            top: 60%;
            animation-delay: 4s;
        }
        .tech-line:nth-child(4) {
            top: 80%;
            animation-delay: 6s;
        }
        .tech-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(0, 149, 255, 0.3) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 0 80px;
            text-align: center;
        }
        .title {
            font-size: 64px;
            font-weight: 700;
            margin-bottom: 40px;
            color: #ffffff;
            opacity: 0;
            animation: fadeIn 2s ease-in-out forwards;
            text-shadow: 0 0 20px rgba(0, 149, 255, 0.5);
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .subtitle {
            font-size: 28px;
            font-weight: 500;
            color: #a8b2d1;
            opacity: 0;
            animation: fadeIn 2s ease-in-out 1s forwards;
            max-width: 800px;
            line-height: 1.5;
        }
        .tech-circle {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(0, 149, 255, 0.3);
            z-index: 1;
        }
        .tech-circle:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -100px;
            right: -100px;
            border-color: rgba(0, 149, 255, 0.2);
        }
        .tech-circle:nth-child(2) {
            width: 200px;
            height: 200px;
            bottom: -50px;
            left: -50px;
            border-color: rgba(0, 149, 255, 0.2);
        }
        @keyframes flow {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                filter: blur(10px);
            }
            100% {
                opacity: 1;
                filter: blur(0);
            }
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="tech-lines">
            <div class="tech-line"></div>
            <div class="tech-line"></div>
            <div class="tech-line"></div>
            <div class="tech-line"></div>
        </div>
        <div class="tech-dots"></div>
        <div class="tech-circle"></div>
        <div class="tech-circle"></div>
        <div class="content">
            <h1 class="title">大模型科普——AI世界的关键密码</h1>
            <p class="subtitle">欢迎来到大模型知识小课堂，一起解锁AI关键概念！</p>
        </div>
    </div>
</body>
</html>
