<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNN：图像识别的'神枪手'</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #0a192f;
            color: #ffffff;
            overflow: hidden;
        }
        .slide-container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #0a192f 0%, #172a45 100%);
        }
        .tech-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(0, 149, 255, 0.3) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 60px 80px;
        }
        .title {
            font-size: 50px;
            font-weight: 700;
            margin-bottom: 40px;
            color: #ffffff;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .main-content {
            display: flex;
            flex: 1;
            gap: 40px;
        }
        .text-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .description {
            font-size: 24px;
            line-height: 1.6;
            color: #a8b2d1;
            margin-bottom: 30px;
        }
        .highlight {
            color: #64ffda;
            font-weight: 500;
        }
        .visual-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .cnn-container {
            position: relative;
            width: 400px;
            height: 400px;
        }
        .image-grid {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 2px;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 10px;
        }
        .grid-cell {
            background-color: rgba(79, 172, 254, 0.3);
            border-radius: 4px;
        }
        .filter {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 3px solid #64ffda;
            border-radius: 8px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(100, 255, 218, 0.5);
            animation: scan 4s linear infinite;
            z-index: 3;
        }
        .filter::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 10px solid #64ffda;
        }
        .feature-map {
            position: absolute;
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
            opacity: 0;
            animation: fadeIn 1s ease-in-out 2s forwards;
        }
        .feature-map-icon {
            font-size: 50px;
            color: white;
        }
        .feature-map-1 {
            top: 20%;
            right: 10%;
        }
        .feature-map-2 {
            bottom: 20%;
            left: 10%;
        }
        .connection {
            position: absolute;
            background: rgba(100, 255, 218, 0.3);
            opacity: 0;
            animation: connect 1.5s ease-in-out forwards;
        }
        .connection-1 {
            width: 4px;
            height: 100px;
            top: 30%;
            right: 20%;
            transform: rotate(-45deg);
            transform-origin: top right;
            animation-delay: 2.5s;
        }
        .connection-2 {
            width: 4px;
            height: 100px;
            bottom: 30%;
            left: 20%;
            transform: rotate(45deg);
            transform-origin: bottom left;
            animation-delay: 2.7s;
        }
        .scan-line {
            position: absolute;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, rgba(100, 255, 218, 0) 0%, rgba(100, 255, 218, 1) 50%, rgba(100, 255, 218, 0) 100%);
            top: 50%;
            left: 0;
            opacity: 0;
            animation: scanLine 4s linear infinite;
            z-index: 2;
        }
        @keyframes scan {
            0% {
                top: 20%;
                left: 20%;
            }
            25% {
                top: 20%;
                left: 60%;
            }
            50% {
                top: 60%;
                left: 60%;
            }
            75% {
                top: 60%;
                left: 20%;
            }
            100% {
                top: 20%;
                left: 20%;
            }
        }
        @keyframes scanLine {
            0% {
                opacity: 0;
                transform: translateY(-100px);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(100px);
            }
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes connect {
            0% {
                opacity: 0;
                height: 0;
            }
            100% {
                opacity: 1;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="tech-dots"></div>
        <div class="content">
            <h1 class="title">CNN：图像识别的'神枪手'</h1>
            <div class="main-content">
                <div class="text-content">
                    <p class="description"><span class="highlight">深度模型</span>，擅长处理<span class="highlight">网格结构数据</span>（如图像）</p>
                    <p class="description">通过<span class="highlight">卷积层</span>提取<span class="highlight">局部特征</span></p>
                    <p class="description">像给图像<span class="highlight">"打特征标记"</span></p>
                    <p class="description">广泛用于<span class="highlight">图像识别</span>、<span class="highlight">视频分析</span>，帮AI<span class="highlight">"看懂"</span>图片</p>
                </div>
                <div class="visual-content">
                    <div class="cnn-container">
                        <div class="image-grid">
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                        </div>
                        <div class="filter"></div>
                        <div class="scan-line"></div>
                        <div class="feature-map feature-map-1">
                            <i class="material-icons feature-map-icon">filter_center_focus</i>
                        </div>
                        <div class="feature-map feature-map-2">
                            <i class="material-icons feature-map-icon">filter</i>
                        </div>
                        <div class="connection connection-1"></div>
                        <div class="connection connection-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
