<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微调：给模型'定制升级'</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #0a192f;
            color: #ffffff;
            overflow: hidden;
        }
        .slide-container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #0a192f 0%, #172a45 100%);
        }
        .tech-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(0, 149, 255, 0.3) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 60px 80px;
        }
        .title {
            font-size: 50px;
            font-weight: 700;
            margin-bottom: 40px;
            color: #ffffff;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .main-content {
            display: flex;
            flex: 1;
            gap: 40px;
        }
        .text-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .description {
            font-size: 24px;
            line-height: 1.6;
            color: #a8b2d1;
            margin-bottom: 30px;
        }
        .highlight {
            color: #64ffda;
            font-weight: 500;
        }
        .visual-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .finetune-container {
            position: relative;
            width: 400px;
            height: 400px;
        }
        .model {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
        }
        .model-icon {
            font-size: 80px;
            color: white;
        }
        .gear {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.5);
            animation: rotate 4s linear infinite;
        }
        .gear-icon {
            font-size: 30px;
            color: white;
        }
        .gear-1 {
            top: 20%;
            left: 20%;
            animation-delay: 0s;
        }
        .gear-2 {
            top: 20%;
            right: 20%;
            animation-delay: 1s;
        }
        .gear-3 {
            bottom: 20%;
            left: 20%;
            animation-delay: 2s;
        }
        .gear-4 {
            bottom: 20%;
            right: 20%;
            animation-delay: 3s;
        }
        .task {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }
        .task-icon {
            font-size: 36px;
            color: white;
            margin-bottom: 5px;
        }
        .task-label {
            font-size: 14px;
            font-weight: 500;
            color: white;
            text-align: center;
        }
        .task-1 {
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 10px 20px rgba(245, 87, 108, 0.5);
            animation-delay: 0.5s;
        }
        .task-2 {
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            box-shadow: 0 10px 20px rgba(250, 112, 154, 0.5);
            animation-delay: 1.5s;
        }
        .connection {
            position: absolute;
            background: rgba(100, 255, 218, 0.3);
            opacity: 0;
            animation: connect 1.5s ease-in-out forwards;
        }
        .connection-1 {
            width: 4px;
            height: 80px;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 1s;
        }
        .connection-2 {
            width: 4px;
            height: 80px;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 2s;
        }
        .skill-label {
            position: absolute;
            font-size: 18px;
            font-weight: 500;
            color: #a8b2d1;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }
        .label-1 {
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 1s;
        }
        .label-2 {
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 2s;
        }
        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes connect {
            0% {
                opacity: 0;
                height: 0;
            }
            100% {
                opacity: 1;
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="tech-dots"></div>
        <div class="content">
            <h1 class="title">微调：给模型'定制升级'</h1>
            <div class="main-content">
                <div class="text-content">
                    <p class="description">对<span class="highlight">预训练模型</span>额外训练，让它更好<span class="highlight">适配特定任务</span></p>
                    <p class="description">好比给AI装<span class="highlight">"专项技能包"</span></p>
                    <p class="description">做<span class="highlight">翻译任务</span>就强化<span class="highlight">翻译能力</span></p>
                    <p class="description">在<span class="highlight">保持基础能力</span>的同时，<span class="highlight">提升特定领域表现</span></p>
                </div>
                <div class="visual-content">
                    <div class="finetune-container">
                        <div class="model">
                            <i class="material-icons model-icon">psychology</i>
                        </div>
                        <div class="gear gear-1">
                            <i class="material-icons gear-icon">settings</i>
                        </div>
                        <div class="gear gear-2">
                            <i class="material-icons gear-icon">settings</i>
                        </div>
                        <div class="gear gear-3">
                            <i class="material-icons gear-icon">settings</i>
                        </div>
                        <div class="gear gear-4">
                            <i class="material-icons gear-icon">settings</i>
                        </div>
                        <div class="task task-1">
                            <i class="material-icons task-icon">translate</i>
                            <span class="task-label">翻译</span>
                        </div>
                        <div class="task task-2">
                            <i class="material-icons task-icon">code</i>
                            <span class="task-label">编程</span>
                        </div>
                        <div class="connection connection-1"></div>
                        <div class="connection connection-2"></div>
                        <div class="skill-label label-1">特定任务</div>
                        <div class="skill-label label-2">能力提升</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
