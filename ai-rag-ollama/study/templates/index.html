<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>与 Ollama 对话</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #chat-container {
            width: 80%;
            max-width: 600px;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        #chatbox {
            height: 300px;
            overflow-y: auto;
            margin-bottom: 10px;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 5px;
        }

        #input-container {
            display: flex;
        }

        #user-input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px 0 0 5px;
        }

        #send-button {
            padding: 8px 15px;
            border: none;
            background-color: #007BFF;
            color: white;
            border-radius: 0 5px 5px 0;
            cursor: pointer;
        }

        #send-button:hover {
            background-color: #0056b3;
        }

        .user-message {
            text-align: right;
            color: #007BFF;
            margin-bottom: 5px;
        }

        .ollama-message {
            text-align: left;
            color: #28a745;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <h1>与 Ollama 对话</h1>
    <div id="chat-container">
        <div id="chatbox"></div>
        <div id="input-container">
            <input type="text" id="user-input" placeholder="输入你的消息">
            <button id="send-button">发送</button>
        </div>
    </div>

    <script>
        const chatbox = document.getElementById('chatbox');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');

        sendButton.addEventListener('click', () => {
            const prompt = userInput.value;
            if (prompt) {
                // 在聊天框中显示用户输入
                const userMessage = document.createElement('p');
                userMessage.classList.add('user-message');
                userMessage.textContent = `你: ${prompt}`;
                chatbox.appendChild(userMessage);
                userInput.value = '';

                const eventSource = new EventSource(`/chat?prompt=${encodeURIComponent(prompt)}`);
                let ollamaMessage = document.createElement('p');
                ollamaMessage.classList.add('ollama-message');
                ollamaMessage.textContent = 'Ollama: ';
                chatbox.appendChild(ollamaMessage);

                eventSource.onmessage = (event) => {
                    try {
                        console.log(event.data);
                        const data = JSON.parse(event.data.replace('data: ', ''));
                        if (data.done) {
                            eventSource.close();
                        } else if (data.response) {
                            ollamaMessage.textContent += data.response;
                        }
                    } catch (error) {
                        console.error('解析数据出错:', error);
                    }
                };

                eventSource.onerror = (error) => {
                    console.error('EventSource 出错:', error);
                    eventSource.close();
                    ollamaMessage.textContent += ' 出错了，请稍后再试。';
                };
            }
        });
    </script>
</body>

</html>
